---
- name: Install pcsc packages
  become: true
  tags:
    - pcscd
  community.general.pacman:
    name:
      - pcsclite
      - ccid
- name: Create gnupg dir
  ansible.builtin.file:
    path: "{{ [ ansible_facts.user_dir, '.gnupg' ] | path_join }}"
    state: directory
    mode: "0644"
- name: Disable scdaemon
  ansible.builtin.copy:
    dest: "{{ [ ansible_facts.user_dir, '.gnupg', 'scdaemon.conf' ] | path_join }}"
    content: |
      disable-ccid
    mode: "0644"
- name: Enable pcscd
  ansible.builtin.systemd_service:
    name: pcscd
    state: started
    enabled: true
