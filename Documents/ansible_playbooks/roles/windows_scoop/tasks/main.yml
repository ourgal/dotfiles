- name: "{{ windows_scoop_state }} packages via scoop"
  tags: admin-scoop-nonportable
  community.windows.win_scoop:
    name: "{{ item }}"
    global: "{{ windows_scoop_global }}"
    state: "{{ windows_scoop_state }}"
  register: result
  retries: 3
  delay: 5
  until: result is not failed
  loop: "{{ windows_scoop_packages }}"
- name: Reboot
  ansible.windows.win_reboot:
  when: "{{ windows_scoop_reboot }}"
