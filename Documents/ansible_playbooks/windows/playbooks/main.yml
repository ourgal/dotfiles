- name: Configure windows game user
  hosts: all
  remote_user: game
  ignore_unreachable: true
  tags: game
  pre_tasks:
    - name: Gather facts
      ansible.builtin.gather_facts:
  roles:
    - role: windows_install_scoop
      windows_install_scoop_is_admin: true
    - role: windows_scoop_bucket
      windows_scoop_bucket_name: aki
      windows_scoop_bucket_repo: https://github.com/akirco/aki-apps
    - role: windows_scoop
      windows_scoop_packages:
        - aki/wegame
    - role: windows_scoop_bucket
      windows_scoop_bucket_name: aki
      windows_scoop_bucket_state: absent
- name: Configure windows admin
  hosts: all
  remote_user: admin
  ignore_unreachable: true
  tags: admin
  pre_tasks:
    - name: Gather facts
      ansible.builtin.gather_facts:
  roles:
    - role: windows_firewall
    - role: windows_hostname
      windows_hostname_name: "{{ inventory_hostname if inventory_hostname is defined else 'nuc' }}"
    - role: windows_service
      windows_service_name: Everything
      windows_service_state: started
      windows_service_path: C:\Users\User\scoop\apps\everything\current\everything.exe
      windows_service_cmd: C:\Users\User\scoop\apps\everything\current\everything.exe -svc
    - role: windows_user_right
      windows_user_right_name: SeRemoteInteractiveLogonRight
      windows_user_right_users: User
