- name: Configure windows admin
  hosts: all
  remote_user: admin
  ignore_unreachable: true
  tags: admin
  roles:
    - role: windows_choco
      windows_choco_packages:
        - visualstudio2026-workload-vctools
        - weasel
        - winfsp # rclone
        - steam
        - epicgameslauncher
        - "{{ 'tailscale' if inventory_hostname == 'work' else omit }}"
        - directx
        - name: openssh
          allow_prerelease: true
          package_params: /SSHServerFeature
    - role: windows_install_wsl
      when: inventory_hostname == 'work'
    - role: windows_hide_user
      windows_hide_user_name: Admin
    - role: windows_user
      windows_user_name: User
      windows_user_groups:
        - Users
    - role: windows_user
      windows_user_name: Game
      windows_user_groups:
        - Users
        - Administrators
    - role: windows_service
      windows_service_name: ssh-agent
      windows_srevice_state: started
      windows_srevice_start_mode: auto
    - role: windows_service
      windows_service_name: wsearch
      windows_srevice_state: stopped
      windows_srevice_start_mode: disabled
    - role: windows_optimize_powershell
    - role: windows_developer_mode
- name: Configure windows user
  hosts: all
  remote_user: user
  ignore_unreachable: true
  tags: user
  pre_tasks:
    - name: Gather facts
      ansible.builtin.gather_facts:
  roles:
    - role: windows_install_scoop
    - role: windows_scoop_update
    - role: windows_scoop
      windows_scoop_packages: "{{ windows_scoop_packages_main_all }}"
    - role: windows_scoop
      windows_scoop_packages:
        - nodejs-lts
        - vscode
- name: Configure windows admin
  hosts: all
  remote_user: admin
  ignore_unreachable: true
  tags: admin
  tasks:
    - name: Reboot
      ansible.windows.win_reboot:
