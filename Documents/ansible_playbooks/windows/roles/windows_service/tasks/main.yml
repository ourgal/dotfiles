- name: Check service exists
  ansible.windows.win_service_info:
    name: "{{ windows_service_name }}"
  register: svc_info
- name: "{{ windows_service_name }} service"
  ansible.windows.win_service:
    name: "{{ windows_service_name }}"
    state: "{{ windows_srevice_state }}"
    start_mode: "{{ windows_srevice_start_mode }}"
  when: svc_info.services | length > 0
