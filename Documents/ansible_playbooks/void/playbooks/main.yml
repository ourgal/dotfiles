# chezmoi:template:left-delimiter=[[ right-delimiter=]]
---
- name: Configure void linux
  hosts: all
  ignore_unreachable: true
  vars:
    xbps_mirror: https://mirror.nju.edu.cn/voidlinux/current
    xbps_nonfree_mirror: https://mirror.nju.edu.cn/voidlinux/current/nonfree
  tasks:
    - name: Debug variables
      ansible.builtin.debug:
        var: ansible_facts
    - name: Upgrade system
      tags:
        - pkg
        - xbps
      become: true
      community.general.xbps:
        upgrade: true
        repositories:
          - "{{ xbps_mirror }}"
          - "{{ xbps_nonfree_mirror }}"
    - name: Install packages
      tags:
        - pkg
        - xbps
      become: true
      environment:
        XBPS_ARCH: "{{ ansible_facts.machine }}"
      community.general.xbps:
        name:
          # download
          - curl
          - aria2
          - yt-dlp
          - transmission
          # grep
          - grep
          - ripgrep
          # video edit
          - ffmpeg
          # archive
          - 7zip
          - atool
          - unzip
          # bookmark
          - buku
          # gpg
          - pcsclite
          - pcsc-ccid
          # clipboard
          - Clipboard
          - xclip
          - xsel
          # editor
          - gvim-huge
          - helix
          - kakoune
          - neovim
          # dotfiles
          - chezmoi
          # file manager
          - lf
          - nnn
          - ranger
          - yazi
          # git
          - git
          # git annex
          - git-annex
          # git encrypt
          - git-crypt
          # git script
          - git-extras
          # git tui
          - lazygit
          - gitui
          # git diff
          - delta
          - difftastic
          # jj
          - jujutsu
          # github
          - github-cli
          # screen
          - tmux
          - zellij
          # share
          - dufs
          - miniserve
          - rclone
          # image edit
          - ImageMagick
          # shell
          - fish-shell
          # fuzzy finder
          - fzf
          - broot
          # history
          - atuin
          # prompt
          - starship
          # cp
          - rsync
          # sync
          - syncthing
          - stc
          # system
          - xtools
          - kmonad
          - psmisc
          - os-prober
          # cd
          - zoxide
          # rename
          - mmv
          # find
          - fd
          # ls
          - eza
          - tree
          # du
          - duf
          - dua-cli
          # top
          - btop
          - htop
          # less
          - bat
          # encrypt
          - gopass
          - keepassxc
          # video player
          - mpv
          # browser
          - firefox
          - chromium
          # terminal
          - kitty
          - alacritty
          # editor
          - emacs-gtk3
          - vscode
          # document
          - sioyek
          - zeal
          # chat
          - telegram-desktop
          # dev
          - editorconfig
          # ansible
          - ansible
          # bash
          - shellcheck
          # toml
          - tombi
          # nodejs
          - nodejs
          # python
          - uv
          # desktop environment
          - xfce4
          - xfce4-battery-plugin
          - xorg
          # display manager
          - lemurs
          - lightdm
          # font
          - noto-fonts-ttf
          - noto-fonts-cjk
          - nerd-fonts-symbols-ttf
          - noto-fonts-emoji
          # video driver
          - intel-video-accel
          # firmware
          - intel-ucode
          # VA
          - libva-utils
          # python
          - python3-pipx
          # flatpak
          - flatpak
          # fcitx5
          - fcitx5-gtk+2
          - fcitx5-gtk+3
          - fcitx5-gtk4
          - fcitx5-qt5
          - fcitx5-qt6
        repositories:
          - "{{ xbps_mirror }}"
          - "{{ xbps_nonfree_mirror }}"
    - name: Uninstall packages
      tags:
        - pkg
        - xbps
      become: true
      environment:
        XBPS_ARCH: "{{ ansible_facts.machine }}"
      community.general.xbps:
        state: absent
        name:
          # sbsrf not working
          - fcitxs
          - fcitx5-rime
          - fcitx5-lua
          - fcitx5-configtool
          - dot-xsession
          - ansible-language-server
          - python3-ansible-lint
        repositories:
          - "{{ xbps_mirror }}"
          - "{{ xbps_nonfree_mirror }}"
    - name: Setup pip mirror
      block:
        - name: Create .pip folder
          ansible.builtin.file:
            dest: "{{ ansible_facts.user_dir }}/.pip"
            state: directory
        - name: Set pip config
          ansible.builtin.copy:
            dest: "{{ ansible_facts.user_dir }}/.pip/pip.ini"
            content: |
              [global]
              index-url = https://mirrors.nju.edu.cn/pypi/web/simple/
              [install]
              trusted-host = mirrors.nju.edu.cn
    - name: Install pipx packages
      tags: pipx
      community.general.pipx:
        name: "{{ item }}"
      loop:
        - jellyfin-mpv-shim
        - leo
        - advance-touch
    - name: Flatpak
      tags:
        - flatpak
      block:
        - name: Add the flathub flatpak repository remote to the user installation
          become: true
          community.general.flatpak_remote:
            name: flathub
            state: present
            flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo
            method: system
        - name: Set mirror
          become: true
          ansible.builtin.command: flatpak remote-modify flathub --url=https://mirror.sjtu.edu.cn/flathub
        - name: Install flatpak packages
          become: true
          community.general.flatpak:
            name:
              - org.fcitx.Fcitx5
              - org.fcitx.Fcitx5.Addon.Rime
            state: present
            method: system
    - name: Services
      become: true
      block:
        - name: Create per user service folder
          ansible.builtin.file:
            dest: "/etc/sv/runsvdir-{{ ansible_user }}"
            state: directory
            mode: "0755"
        - name: Create run script
          ansible.builtin.copy:
            dest: "/etc/sv/runsvdir-{{ ansible_user }}/run"
            mode: "0755"
            content: |
              #!/bin/sh

              export USER="{{ ansible_user }}"
              export HOME="/home/{{ ansible_user }}"

              groups="$(id -Gn "$USER" | tr ' ' ':')"
              svdir="$HOME/service"

              exec chpst -u "$USER:$groups" runsvdir "$svdir"
        - name: Create lemurs service folder
          ansible.builtin.file:
            dest: /etc/sv/lemurs
            state: directory
            mode: "0755"
        - name: Create run script
          ansible.builtin.copy:
            dest: /etc/sv/lemurs/run
            mode: "0755"
            content: |
              #!/bin/sh
              # /etc/sv/lemurs/run
              # Start Lemurs on tty7 (via agetty) and, best-effort, switch to tty7 during boot.

              # If we're on a real virtual terminal (VT) console: switch to tty7 so Lemurs is visible immediately.
              if command -v fgconsole >/dev/null 2>&1 && command -v chvt >/dev/null 2>&1; then
                cur="$(fgconsole 2>/dev/null || echo "")"
                if [ -n "$cur" ] && [ "$cur" != "serial" ] && [ "$cur" != "7" ]; then
                  chvt 7 2>/dev/null || true
                fi
              fi

              # Protect tty7 from kernel printk messages so they don't overwrite Lemurs' TUI.
              TERM=linux setterm --msg off </dev/tty7 >/dev/tty7 2>/dev/null || true

              # Optional: clear tty7 once so old screen contents don't "shine through" into the UI.
              TERM=linux setterm --clear=all </dev/tty7 >/dev/tty7 2>/dev/null || true

              # Runit expects this script to exec a single foreground process.
              # agetty attaches to /dev/tty7, sets TERM=linux, and starts Lemurs as the login program.
              exec agetty --noissue --skip-login --login-program /usr/bin/lemurs tty7 linux
    - name: Enable services
      become: true
      ansible.builtin.file:
        src: "/etc/sv/{{ item }}"
        dest: "/var/service/{{ item }}"
        state: link
      loop:
        - "runsvdir-{{ ansible_user }}"
        - lightdm
        - pcscd
    - name: Disable services
      become: true
      ansible.builtin.file:
        path: "/var/service/{{ item }}"
        state: absent
      loop:
        - lemurs
    - name: Create pam lemurs
      become: true
      ansible.builtin.copy:
        dest: /etc/pam.d/lemurs
        mode: "0644"
        content: |
          #%PAM-1.0
          auth        include    login
          account     include    login
          session     include    login
          password    include    login
    - name: Set lemurs config
      become: true
      ansible.builtin.lineinfile:
        path: /etc/lemurs/config.toml
        regexp: '^tty ='
        line: tty = 7
    - name: LinuxBrew
      tags:
        - pkg
        - brew
      environment:
        PATH: "/home/linuxbrew/.linuxbrew/bin:{{ ansible_env.PATH }}"
        HOMEBREW_BREW_GIT_REMOTE: "https://mirror.nju.edu.cn/git/homebrew/brew.git"
      block:
        - name: Check if Homebrew is installed
          ansible.builtin.stat:
            path: "/home/linuxbrew/.linuxbrew/bin/brew"
          register: brew_stat
        - name: Create Homebrew directory
          ansible.builtin.file:
            path: "/home/linuxbrew/.linuxbrew"
            state: directory
            owner: "{{ ansible_env.USER }}"
            group: "{{ ansible_env.USER }}"
            mode: '0755'
          become: true
          when: not brew_stat.stat.exists
        - name: Install Homebrew
          ansible.builtin.shell: |
            curl -fsSL https://github.com/Homebrew/brew/tarball/master | tar xz --strip 1 -C /home/linuxbrew/.linuxbrew
          when: not brew_stat.stat.exists
        - name: Install linuxbrew packages
          tags:
            - pkg
            - linuxbrew
            - homebrew
          community.general.homebrew:
            name:
              - mani
              - ansible-language-server
              - ansible-lint
              - mcfly
              - oh-my-posh
            state: latest
            update_homebrew: true
            upgrade: true
    - name: Set the system hostname
      become: true
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"
    - name: Set user groups
      become: true
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups:
          - '{{ "input" if ansible_facts.os_family == "Void" else omit }}'
        append: true
    - name: Regenerate initramfs
      become: true
      ansible.builtin.command:
        cmd: "xbps-reconfigure --force linux{{ ansible_facts.kernel | regex_search('\\d+\\.\\d+') }}"
      changed_when: true
    - name: Download xlocate data
      changed_when: true
      ansible.builtin.command:
        cmd: xlocate -S
    - name: Enable os-prober
      become: true
      ansible.builtin.lineinfile:
        path: /etc/default/grub
        line: GRUB_DISABLE_OS_PROBER=false
    - name: Generate grub config
      become: true
      ansible.builtin.command:
        cmd: grub-mkconfig -o /boot/grub/grub.cfg
      changed_when: true
