# chezmoi:template:left-delimiter=[[ right-delimiter=]]
---
- name: Install pcsc packages
  become: true
  tags:
    - pkg
    - pcscd
  ansible.builtin.apt:
    name:
      - gnupg
      - pcscd
      - scdaemon
      - pcsc-tools
- name: Enable pcscd
  become: true
  ansible.builtin.systemd_service:
    name: pcscd
    state: started
    enabled: true
