# chezmoi:template:left-delimiter=[[ right-delimiter=]]
---
- name: Update apt cache
  tags:
    - pkg
    - apt
  become: true
  ansible.builtin.apt:
    update_cache: true

- name: Install packages
  tags:
    - pkg
    - apt
  become: true
  vars:
    host_pkgs: "{{ apt_host_packages[inventory_hostname] | default({}, true) }}"
  ansible.builtin.apt:
    name: "{{ (apt_packages.values() | list + host_pkgs.values() | list) | flatten }}"

- name: Uninstall packages
  tags:
    - pkg
    - apt
  become: true
  ansible.builtin.apt:
    state: absent
    purge: true
    name: "{{ apt_removed_packages.values() | flatten | list }}"
