- name: Configure windows admin
  hosts: windows
  remote_user: admin
  ignore_unreachable: true
  tags: admin
  tasks:
    - name: Gather facts
      ansible.builtin.gather_facts:
    - name: Debug variables
      ansible.builtin.debug:
        var: ansible_facts
    - name: Windows firewall rules
      tags: firewall
      block:
        - name: Facts
          ansible.builtin.gather_facts:
          when: ansible_facts.user_dir is not defined
        - name: Disable firewall for Domain, Public and Private profiles
          ansible.windows.win_firewall:
            state: disabled
            profiles:
              - Domain
              - Private
              - Public
    - name: Set hostname
      tags: hostname
      block:
        - name: Set hostname
          ansible.windows.win_hostname:
            name: "{{ my_hostname if my_hostname is defined else 'nuc' }}"
          register: res
        - name: Reboot
          ansible.windows.win_reboot:
          when: res.reboot_required
    - name: Services
      tags: service
      block:
        - name: Check everything exists
          ansible.windows.win_stat:
            path: C:\Users\User\scoop\apps\everything\current\everything.exe
          register: everything_bin
        - name: Create everything service
          ansible.windows.win_service:
            name: Everything
            state: started
            path: C:\Users\User\scoop\apps\everything\current\everything.exe -svc
          when: everything_bin.stat.exists is true
        - name: Check goodbyedpi exists
          ansible.windows.win_stat:
            path: C:\Users\User\scoop\apps\goodbyedpi\current\goodbyedpi.exe
          register: goodbyedpi_bin
        - name: Create goodbyedpi service
          ansible.windows.win_service:
            name: Goodbyedpi
            state: started
            path: C:\Users\User\scoop\apps\goodbyedpi\current\goodbyedpi.exe
          when:
            - goodbyedpi_bin.stat.exists is true
            - ansible_facts.nodename == 'work'
    - name: Install scream post
      when: ansible_facts.nodename in ['bed', 'nuc']
      tags: scream-post
      block:
        - name: Delete files
          ansible.windows.win_file:
            path: "{{ item }}"
            state: absent
          loop:
            - C:\Scream.zip
            - C:\Scream
        - name: Disable testing mode
          ansible.windows.win_command: Bcdedit.exe -set TESTSIGNING OFF
        - name: Reboot
          ansible.windows.win_reboot:
        - name: Unicast options
          ansible.windows.win_regedit:
            path: HKLM:\SYSTEM\CurrentControlSet\Services\Scream\Options
            name: UnicastIPv4
            data: 192.168.123.100
        - name: Unicast options
          ansible.windows.win_regedit:
            path: HKLM:\SYSTEM\CurrentControlSet\Services\Scream\Options
            name: UnicastPort
            data: 4011
            type: dword
    - name: Allow remote logon
      ansible.windows.win_user_right:
        name: SeRemoteInteractiveLogonRight
        users:
          - User
        action: add
    - name: Set openssh default shell to git bash
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\OpenSSH
        name: DefaultShell
        data: C:\Users\User\scoop\apps\git\current\bin\bash.exe
        type: string
  handlers:
    - name: Reboot
      ansible.windows.win_reboot:
