          loop:
            - pynvim
            - SimpleWebSocketServer
            - python-slugify
            - pywinauto
            - guessit
            - requests
        - name: Remove pip config
          ansible.windows.win_file:
            path: "{{ ansible_facts.env.APPDATA }}\\.pip\\pip.ini"
            state: absent

    - name: WSL
      tags: wsl
      when: ansible_facts.nodename == 'work'
      block:
        - name: Update wsl
          ansible.windows.win_command: wsl --update
        - name: Set WSL default version to 2
          ansible.windows.win_command: wsl --set-default-version 2
        - name: Install arch linux
          ansible.windows.win_command: wsl --install archlinux --no-launch
