    - name: Pipx
      tags: pipx
      block:
        - name: Add pipx bin path to PATH
          ansible.windows.win_path:
            state: present
            scope: user
            elements: '%userprofile%\.local\bin'
        - name: Create .pip folder
          ansible.windows.win_file:
            dest: "{{ ansible_facts.env.APPDATA }}\\.pip"
            state: directory
        - name: Set pip config
          ansible.windows.win_copy:
            dest: "{{ ansible_facts.env.APPDATA }}\\.pip\\pip.ini"
            content: |
              [global]
              index-url = https://mirrors.cernet.edu.cn/pypi/web/simple/
              [install]
              trusted-host = mirrors.cernet.edu.cn
        - name: Install pipx packages
          tags: pipx-install
          ansible.windows.win_shell: "pipx install {{ item }}"
          loop:
            - advance-touch
            - xonsh[full]
            - mutagen
            - jedi-language-server
            - python-lsp-server
            - basedpyright
            - grip
            - names
            - leo
            - copyparty
            - ffmpeg-progress-yield
            - vim-vint --preinstall "setuptools<81"
            - aria2p[tui]
            - tewi-torrent
            - tvnamer
            - mnamer
        - name: Remove pip config
          ansible.windows.win_file:
            path: "{{ ansible_facts.env.APPDATA }}\\.pip\\pip.ini"
            state: absent
    - name: Add cargo bin path to PATH
      tags: path
      ansible.windows.win_path:
        state: present
        scope: user
        elements: '%userprofile%\.cargo\bin'
    - name: Create .cargo folder
      ansible.windows.win_file:
        dest: "{{ ansible_facts.user_dir }}\\.cargo"
        state: directory
    - name: Set cargo config
      ansible.windows.win_copy:
        dest: "{{ ansible_facts.user_dir }}\\.cargo\\config.toml"
        content: |
          [source.crates-io]
          replace-with = 'mirror'

          [source.mirror]
          registry = "sparse+https://mirrors.cernet.edu.cn/crates.io-index/"

          [registries.mirror]
          index = "sparse+https://mirrors.cernet.edu.cn/crates.io-index/"
    - name: Install cargo packages
      tags: cargo-install
      ansible.windows.win_shell: "cargo install --locked --git {{ item }}"
      loop:
        - https://github.com/estin/simple-completion-language-server.git
    - name: Remove cargo config
      ansible.windows.win_file:
        path: "{{ ansible_facts.user_dir }}\\.cargo\\config.toml"
        state: absent
    - name: Npm
      tags: npm
      block:
        - name: Set npm config
          ansible.windows.win_copy:
            dest: "{{ ansible_facts.user_dir }}\\.npmrc"
            content: |
              registry = https://registry.npmmirror.com
        - name: Install npm packages
          ansible.windows.win_shell: npm install -g "{{ item }}"
          loop:
            - prettier
            - vscode-langservers-extracted
            - yaml-language-server
            - "@ansible/ansible-language-server"
            - vim-language-server
        - name: Remove npm config
          ansible.windows.win_file:
            path: "{{ ansible_facts.user_dir }}\\.npmrc"
            state: absent
    - name: Facts
      tags: user-env
      ansible.builtin.gather_facts:
      when: ansible_facts.user_dir is not defined
    - name: Set home environment variable
      tags: user-env
      ansible.windows.win_environment:
        state: present
        name: HOME
        value: "{{ ansible_facts.user_dir }}"
        level: user
    - name: Add doom bin path to PATH
      tags:
        - user-env
        - path
      ansible.windows.win_path:
        state: present
        scope: user
        elements: '%userprofile%\.emacs.d\bin'
    - name: Set go environment variable
      tags: user-env
      ansible.windows.win_environment:
        state: present
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        level: user
      loop:
        - name: GO111MODULE
          value: "on"
        - name: GOPROXY
          value: https://goproxy.cn
    - name: Set rime as default input method
      ansible.windows.win_regedit:
        path: HKCU:\Keyboard Layout\Preload
        name: 1
        data: 00000804
    - name: Set en as second input method
      ansible.windows.win_regedit:
        path: HKCU:\Keyboard Layout\Preload
        name: 2
        data: 00000409
    - name: Add msys bin path to PATH
      tags: path
      ansible.windows.win_path:
        state: present
        scope: user
        elements: '%userprofile%\scoop\apps\msys2\current\mingw64\bin'
    - name: Pip
      tags: pip
      block:
        - name: Create .pip folder
          ansible.windows.win_file:
            dest: "{{ ansible_facts.env.APPDATA }}\\.pip"
            state: directory
        - name: Set pip config
          ansible.windows.win_copy:
            dest: "{{ ansible_facts.env.APPDATA }}\\.pip\\pip.ini"
            content: |
              [global]
              index-url = https://mirrors.cernet.edu.cn/pypi/web/simple/
