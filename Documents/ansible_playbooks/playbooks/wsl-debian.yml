---
- name: Configure wsl debian
  hosts: nuc-windows-wsl-debian
  tasks:
    - name: Debug variables
      ansible.builtin.debug:
        var: ansible_facts
    - name: Set mirror
      block:
        - name: First mirror url
          ansible.builtin.replace:
            path: /etc/apt/sources.list
            regexp: http://deb.debian.org/
            replace: https://mirrors.aliyun.com/
        - name: Second mirror url
          ansible.builtin.replace:
            path: /etc/apt/sources.list
            regexp: http://security.debian.org/
            replace: https://mirrors.aliyun.com/
    - name: Update apt
      ansible.builtin.apt:
        update_cache: true
    - name: Install apt packages
      ansible.builtin.apt:
        name:
          # git
          - git
          - lazygit
          # editor
          - emacs
          - vim-gtk3
          - hx
          # video viewer
          - mpv
          # download
          - curl
          - wget
          # shell
          - fish
          # prompt
          - starship
          # system
          - xclip
          - dos2unix
          # fuzzy
          - fzf
          # ls
          - eza
          # cd
          - zoxide
          # less
          - bat
          # top
          - btop
          # encypt
          - gnupg
          - scdaemon
          - pcscd
          # nodejs
          - nodejs
    - name: Install xz-utils
      ansible.builtin.apt:
        name: xz-utils
    - name: Install chezmoi
      ansible.builtin.apt:
        deb: https://github.com/twpayne/chezmoi/releases/download/v2.69.4/chezmoi_2.69.4_linux_amd64.deb
