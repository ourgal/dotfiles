{{- /* chezmoi:modify-template */ -}}
{{ $origin := fromIni .chezmoi.stdin -}}
{{ $origin = $origin | setValueAtPath "mega_a.type" "mega" -}}
{{ $origin = $origin | setValueAtPath "mega_a.user" (gopass "rclone/mega_a/user") -}}
{{ $origin = $origin | setValueAtPath "mega_a.pass" (gopass "rclone/mega_a/pass") -}}
{{ $origin = $origin | setValueAtPath "mega_a.session_id" (gopass "rclone/mega_a/session_id") -}}
{{ $origin = $origin | setValueAtPath "mega_a.master_key" (gopass "rclone/mega_a/master_key") -}}
{{ $origin = $origin | setValueAtPath "alist.type" "webdav" -}}
{{ $origin = $origin | setValueAtPath "alist.url" "http://localhost:5244/dav/" -}}
{{ $origin = $origin | setValueAtPath "alist.vendor" "other" -}}
{{ $origin = $origin | setValueAtPath "alist.user" "admin" -}}
{{ $origin = $origin | setValueAtPath "alist.pass" (gopass "rclone/alist/local" | output "rclone" "obscure" | trim ) -}}
{{ $origin | toIni -}}
