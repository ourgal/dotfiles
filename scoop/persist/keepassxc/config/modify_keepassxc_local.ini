{{- /* chezmoi:modify-template */ -}}
{{ $origin := fromIni .chezmoi.stdin -}}
{{ $origin = $origin | setValueAtPath "Security.QuickUnlock" true -}}
{{ $origin = $origin | setValueAtPath "General.LastActiveDatabase" (joinPath .chezmoi.homeDir "syncthing" "keepassxc" "main.kdbx") -}}
{{ $origin = $origin | setValueAtPath "General.LastDatabases" (joinPath .chezmoi.homeDir "syncthing" "keepassxc" "main.kdbx") -}}
{{ $origin = $origin | setValueAtPath "General.LastOpenedDatabases" (joinPath .chezmoi.homeDir "syncthing" "keepassxc" "main.kdbx") -}}
{{ $origin = $origin | setValueAtPath "General.LastChallengeResponse" "" -}}
{{ $origin = $origin | setValueAtPath "General.LastKeyFiles" "" -}}
{{ $origin = $origin | setValueAtPath "GUI.ListViewState" "" -}}
{{ $origin = $origin | setValueAtPath "GUI.MainWindowGeometry" "" -}}
{{ $origin = $origin | setValueAtPath "GUI.MainWindowState" "" -}}
{{ $origin = $origin | setValueAtPath "GUI.SearchViewState" "" -}}
{{ $origin | toIni -}}
