{{ if eq .chezmoi.os "windows" -}}
{{ if lookPath "keepassxc" -}}
{{- /* chezmoi:modify-template */ -}}
{{ $origin := fromIni .chezmoi.stdin -}}
{{ $origin = $origin | setValueAtPath "GUI.CheckForUpdates" false -}}
{{ $origin = $origin | setValueAtPath "GUI.MinimizeOnStartup" false -}}
{{ $origin = $origin | setValueAtPath "GUI.ShowTrayIcon" false -}}
{{ $origin = $origin | setValueAtPath "GUI.MinimizeToTray" false -}}
{{ $origin = $origin | setValueAtPath "GUI.MinimizeOnClose" false -}}
{{ $origin = $origin | setValueAtPath "GUI.TrayIconAppearance" "monochrome" -}}
{{ $origin = $origin | setValueAtPath "Browser.Enabled" true -}}
{{ $origin = $origin | setValueAtPath "General.MinimizeAfterUnlock" false -}}
{{ $origin = $origin | setValueAtPath "General.AutoGeneratePasswordForNewEntries" true -}}
{{ $origin = $origin | setValueAtPath "General.GlobalAutoTypeKey" "65" -}}
{{ $origin = $origin | setValueAtPath "General.GlobalAutoTypeModifiers" "234881024" -}}
{{ $origin = $origin | setValueAtPath "SSHAgent.Enabled" false -}}
{{ $origin = $origin | setValueAtPath "SSHAgent.UseOpenSSH" true -}}
{{ $origin = $origin | setValueAtPath "SSHAgent.UsePageant" false -}}
{{ $origin = $origin | setValueAtPath "Security.AutotypeAsk" false -}}
{{ $origin | toIni -}}
{{ end -}}
{{ end -}}
