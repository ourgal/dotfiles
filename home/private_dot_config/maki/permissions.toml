[bash]
allow = [
    "git *",
    "chezmoi *",
    "echo *",
    "find *",
    "head *",
    "ls *",
    "sort *",
    "grep *",
    "cat *",
    "maki *",
    "cd *",
    "pwd *",
    "sed *",
    "Select-String *",
    "which *",
    "tail *",
    "wc *",
    "where *",
    "curl *",
    "mkdir *",
    "cp *",
    "diff *",
    "cmp *",
    "printf *",
    "webfetch *",
    "tr *",
    "xargs *",
]

[webfetch]
allow = [
    "https://api.github.com/repos/tontinton/maki/releases/latest",
]

[websearch]
allow = [
    "chezmoi .chezmoiignore apply to externals git-repo .chezmoiexternal ignore patterns",
]
