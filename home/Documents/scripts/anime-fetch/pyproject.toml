[project]
name = "anime-fetch"
version = "0.1.0"
description = "Automate the HEVC/AV1 anime download workflow against a local Seanime server"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
anime-fetch = "anime_fetch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anime_fetch"]

[tool.uv]
package = true
