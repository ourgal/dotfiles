---
- name: Configure arch linux
  hosts: all
  ignore_unreachable: true
  roles:
    - role: pacman
    - role: paru
    - role: surface_touch
      when: ansible_facts.hostname == "surface"
    - role: hostname
    - role: hosts
    - role: sudoers
    - role: ufw
    - role: services
    - role: pcscd
    - role: fcitx5
