---
- name: Configure arch linux
  hosts: desktop
  ignore_unreachable: true
  roles:
    - role: pacman
      when: pacman_enabled | default(true) | bool
    - role: paru
      when: paru_enabled | default(true) | bool
    - role: aur
      when: aur_enabled | default(true) | bool
    - role: surface_touch
      when: (surface_touch_enabled | default(true) | bool) and ansible_facts.hostname == "surface"
    - role: miryoku
      when: (miryoku_enabled | default(true) | bool) and ansible_facts.hostname == "surface"
    - role: tlp
      when: (tlp_enabled | default(true) | bool) and ansible_facts.hostname == "surface"
    - role: intel_graphics
      when: (intel_graphics_enabled | default(true) | bool) and ansible_facts.hostname == "surface"
    - role: amd_graphics
      when: (amd_graphics_enabled | default(true) | bool) and ansible_facts.hostname == "air"
    - role: hostname
      when: hostname_enabled | default(true) | bool
    - role: hosts
      when: hosts_enabled | default(true) | bool
    - role: sudoers
      when: sudoers_enabled | default(true) | bool
    - role: ufw
      when: ufw_enabled | default(true) | bool
    - role: services
      when: services_enabled | default(true) | bool
    - role: dunst
      when: dunst_enabled | default(true) | bool
    - role: tmux_server
      when: tmux_server_enabled | default(true) | bool
    - role: redshift
      when: redshift_enabled | default(true) | bool
    - role: autorandr
      when: autorandr_enabled | default(true) | bool
    - role: tailscale
      when: tailscale_enabled | default(true) | bool
    - role: mihomo
      when: mihomo_enabled | default(true) | bool
      vars:
        mihomo_service_enabled: false
    - role: pcscd
      when: pcscd_enabled | default(true) | bool
    - role: fcitx5
      when: fcitx5_enabled | default(true) | bool
    - role: plymouth
      when: plymouth_enabled | default(true) | bool
    - role: ly
      when: ly_enabled | default(true) | bool
    - role: wallpaper
      when: wallpaper_enabled | default(true) | bool
    - role: fingerprint
      when: (fingerprint_enabled | default(true) | bool) and ansible_facts.hostname == "surface"
    - role: ssh_agent
      when: ssh_agent_enabled | default(true) | bool
    - role: hermes_agent
      when: hermes_agent_enabled | default(true) | bool
    - role: npm
      when: npm_enabled | default(true) | bool
    - role: default_apps
      when: default_apps_enabled | default(true) | bool
    - role: blogtato
      when: blogtato_enabled | default(true) | bool
    - role: scls
      when: scls_enabled | default(true) | bool
    - role: pipx
      when: pipx_enabled | default(true) | bool
    - role: maple_fonts
      when: maple_fonts_enabled | default(true) | bool
