---
- name: Configure Arch Linux AI server
  hosts: ai_servers
  ignore_unreachable: true
  pre_tasks:
    # Explicit decrypt; the community.sops vars plugin is enabled but an
    # unloadable plugin would otherwise silently leave the secrets undefined.
    - name: Load encrypted credentials
      community.sops.load_vars:
        file: "{{ inventory_dir }}/group_vars/secrets.sops.yml"
  roles:
    - role: pacman
      when: pacman_enabled | default(true) | bool
      vars:
        pacman_packages:
          ai:
            - btop
            - nvtop
    - role: paru
      when: paru_enabled | default(true) | bool
    - role: exllamav3
      when: exllamav3_enabled | default(true) | bool
    - role: bonsai
      when: bonsai_enabled | default(true) | bool
    # LLM is the local llama.cpp server: OpenAI-compatible endpoint of the bonsai
    # role (llama-server takes any API key), reached from the container via
    # host-gateway.
    - role: hindsight
      when: hindsight_enabled | default(true) | bool
      vars:
        hindsight_llm_model: "{{ bonsai_alias }}"
        hindsight_llm_base_url: "http://host.docker.internal:{{ bonsai_port }}/v1"
        hindsight_llm_api_key: "not-needed"
