---
- name: Configure Arch Linux AI server
  hosts: ai_servers
  ignore_unreachable: true
  roles:
    - role: pacman
      when: pacman_enabled | default(true) | bool
      vars:
        pacman_packages:
          ai:
            - ansible
            - ansible-core
            - btop
            - nvtop
    - role: paru
      when: paru_enabled | default(true) | bool
    - role: aur
      when: aur_enabled | default(true) | bool
      vars:
        aur_packages:
          - llama.cpp-vulkan-bin
    - role: llama_cpp
      when: llama_cpp_enabled | default(true) | bool
