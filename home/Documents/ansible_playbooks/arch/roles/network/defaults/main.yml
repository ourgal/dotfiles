---
network_enabled: false
network_interface: "{{ ansible_facts.get('default_ipv4', {}).get('interface', 'eth0') }}"
network_address: "{{ ansible_facts.get('default_ipv4', {}).get('address', '192.168.0.101') }}"
network_netmask: "{{ ansible_facts.get('default_ipv4', {}).get('netmask', '255.255.255.0') }}"
network_gateway: "{{ ansible_facts.get('default_ipv4', {}).get('gateway', '192.168.0.1') }}"
network_dns_servers:
  - "{{ network_gateway }}"
  - 223.5.5.5
