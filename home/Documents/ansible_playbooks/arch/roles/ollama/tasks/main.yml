---
- name: Install Ollama with ROCm support
  become: true
  tags:
    - pkg
    - ollama
  community.general.pacman:
    name: "{{ ollama_packages }}"
    state: present

- name: Grant the Ollama service access to the GPU
  become: true
  tags:
    - ollama
  ansible.builtin.user:
    name: "{{ ollama_user }}"
    groups:
      - video
      - render
    append: true

- name: Create the Ollama systemd drop-in directory
  become: true
  tags:
    - config
    - ollama
  ansible.builtin.file:
    path: /etc/systemd/system/{{ ollama_service }}.service.d
    state: directory
    mode: "0755"

- name: Expose the Ollama API on the configured address
  become: true
  tags:
    - config
    - ollama
  ansible.builtin.copy:
    dest: /etc/systemd/system/{{ ollama_service }}.service.d/override.conf
    content: |
      [Service]
      Environment="OLLAMA_HOST={{ ollama_host }}:{{ ollama_port }}"
    mode: "0644"
  notify: Restart Ollama

- name: Enable and start Ollama
  become: true
  tags:
    - service
    - ollama
  ansible.builtin.systemd_service:
    name: "{{ ollama_service }}"
    enabled: true
    state: started
    daemon_reload: true

- name: Open the Ollama port
  become: true
  tags:
    - service
    - ollama
  community.general.ufw:
    rule: allow
    port: "{{ ollama_port }}"
    proto: tcp

- name: Wait for the Ollama API
  tags:
    - ollama
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ ollama_port }}"
    timeout: 30

- name: Pull the local models
  become: true
  become_user: "{{ ollama_user }}"
  tags:
    - ollama
  ansible.builtin.command:
    cmd: ollama pull {{ item }}
  loop: "{{ ollama_models }}"
  changed_when: false
  environment:
    HOME: "{{ ollama_home }}"
    OLLAMA_HOST: "http://127.0.0.1:{{ ollama_port }}"
