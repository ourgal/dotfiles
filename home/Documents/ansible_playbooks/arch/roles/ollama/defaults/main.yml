---
ollama_enabled: true
ollama_port: 11434
# 0.0.0.0 exposes the unauthenticated API on the LAN; use 127.0.0.1 for local only.
ollama_host: 0.0.0.0
# gfx1100 (RX 7900 XTX): ollama-rocm ships the ROCm runners and depends on the
# base ollama package plus hipblas/rocm-hip-runtime.
ollama_packages:
  - ollama
  - ollama-rocm
# Quantized models that fit comfortably in the card's 24 GiB of VRAM.
ollama_models:
  - qwen3:14b
ollama_service: ollama
ollama_user: ollama
ollama_home: /usr/share/ollama
