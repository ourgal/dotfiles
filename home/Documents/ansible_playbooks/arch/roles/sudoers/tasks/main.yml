---
- name: Add the user to the wheel group
  become: true
  ansible.builtin.user:
    name: "{{ sudoers_user }}"
    groups: "{{ sudoers_group }}"
    append: true

- name: Require a password for sudo
  become: true
  community.general.sudoers:
    name: "{{ sudoers_user }}"
    state: present
    group: "{{ sudoers_group }}"
    commands: ALL
    nopassword: false
