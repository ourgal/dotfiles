---
- name: Import the linux-surface signing key
  become: true
  community.general.pacman_key:
    id: "{{ surface_key_id }}"
    url: "{{ surface_key_url }}"
    state: present

- name: Add the linux-surface repository
  become: true
  ansible.builtin.blockinfile:
    path: /etc/pacman.conf
    marker: "# {mark} ANSIBLE MANAGED BLOCK linux-surface"
    block: |
      [linux-surface]
      Server = {{ surface_repo_url }}

- name: Install the Surface kernel, IPTS daemon, and touch firmware
  become: true
  community.general.pacman:
    name: "{{ surface_packages }}"
    state: present
    update_cache: true

# The system boots systemd-boot UKIs, so give the Surface kernel its own UKI
# instead of a plain initramfs that systemd-boot cannot discover.
- name: Read the stock kernel preset
  become: true
  ansible.builtin.slurp:
    src: "{{ surface_stock_preset }}"
  register: surface_stock
  failed_when: false

- name: Require the stock kernel preset
  ansible.builtin.assert:
    that: surface_stock.content is defined
    fail_msg: "{{ surface_stock_preset }} is missing; the stock linux package must be installed."

- name: Configure a UKI preset for the Surface kernel
  when: (surface_stock.content | b64decode) is search('(?m)^default_uki=')
  become: true
  ansible.builtin.copy:
    content: "{{ surface_stock.content | b64decode | replace('linux', surface_kernel_package) }}"
    dest: "{{ surface_preset }}"
    mode: '0644'
  register: surface_preset_result

- name: Build the Surface kernel image
  when: surface_preset_result is changed
  become: true
  ansible.builtin.command:
    cmd: "mkinitcpio -p {{ surface_kernel_package }}"

- name: Load uinput at boot
  become: true
  ansible.builtin.copy:
    content: "uinput\n"
    dest: /etc/modules-load.d/uinput.conf
    mode: '0644'
  register: surface_uinput_config

- name: Load uinput now
  when: surface_uinput_config is changed
  become: true
  ansible.builtin.command:
    cmd: modprobe uinput
