---
- name: Create the tmux server user systemd unit directory
  become: true
  become_user: "{{ tmux_server_user }}"
  tags:
    - config
    - tmux_server
  ansible.builtin.file:
    path: "{{ tmux_server_unit_dir }}"
    state: directory
    owner: "{{ tmux_server_user }}"
    group: "{{ tmux_server_user }}"
    mode: "0755"

- name: Install the tmux server user service
  become: true
  become_user: "{{ tmux_server_user }}"
  tags:
    - config
    - tmux_server
  ansible.builtin.template:
    src: tmux-server.service.j2
    dest: "{{ tmux_server_unit_dir }}/{{ tmux_server_service }}.service"
    owner: "{{ tmux_server_user }}"
    group: "{{ tmux_server_user }}"
    mode: "0644"

- name: Enable and start the tmux server user service
  become: true
  become_user: "{{ tmux_server_user }}"
  tags:
    - service
    - tmux_server
  ansible.builtin.systemd_service:
    scope: user
    name: "{{ tmux_server_service }}.service"
    enabled: true
    state: started
    daemon_reload: true
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.user_uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ ansible_facts.user_uid }}/bus"
