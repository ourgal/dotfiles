---
# Install the drop-in libfprint first so fprintd (installed below) resolves its
# dependency against it instead of pulling in the stock libfprint from pacman.
- name: Check the installed Goodix libfprint version
  ansible.builtin.command:
    cmd: pacman -Q libfprint-goodix55b4
  register: fingerprint_libfprint_installed
  changed_when: false
  failed_when: false
  tags:
    - pkg
    - fingerprint

- name: Install the Goodix libfprint driver from the GitHub release
  when: >-
    fingerprint_libfprint_installed.rc != 0 or
    fingerprint_libfprint_version not in fingerprint_libfprint_installed.stdout
  tags:
    - pkg
    - fingerprint
  become: true
  block:
    - name: Download the Goodix libfprint package
      ansible.builtin.get_url:
        url: "{{ fingerprint_libfprint_url }}"
        dest: "{{ fingerprint_libfprint_archive_path }}"
        checksum: "sha256:{{ fingerprint_libfprint_sha256 }}"
        mode: '0600'

    # The package provides libfprint and conflicts with the stock one. Drop
    # stock libfprint without removing fprintd, which depends on the provides.
    - name: Remove the stock libfprint
      ansible.builtin.command:
        cmd: pacman -Rdd --noconfirm libfprint
      register: fingerprint_remove_libfprint
      changed_when: fingerprint_remove_libfprint.rc == 0
      failed_when:
        - fingerprint_remove_libfprint.rc != 0
        - "'target not found' not in fingerprint_remove_libfprint.stderr"
      notify: Restart fprintd

    - name: Install the downloaded Goodix libfprint package
      ansible.builtin.command:
        cmd: "pacman -U --noconfirm {{ fingerprint_libfprint_archive_path }}"
      changed_when: true
      notify: Restart fprintd

    - name: Remove the downloaded Goodix libfprint package
      ansible.builtin.file:
        path: "{{ fingerprint_libfprint_archive_path }}"
        state: absent

- name: Install fingerprint packages
  become: true
  tags:
    - pkg
    - fingerprint
  community.general.pacman:
    name: "{{ fingerprint_packages }}"
    state: present

# 'sufficient' must come before pam_unix so a successful scan short-circuits
# the auth stack; a miss (or no prints enrolled) falls through to the password.
- name: Enable fingerprint authentication in PAM
  become: true
  tags:
    - config
    - fingerprint
  ansible.builtin.blockinfile:
    path: "/etc/pam.d/{{ item }}"
    marker: "# {mark} ANSIBLE MANAGED BLOCK {{ fingerprint_pam_marker }}"
    block: "auth sufficient pam_fprintd.so"
    insertbefore: '^auth\b'
    create: false
  loop: "{{ fingerprint_pam_services }}"
