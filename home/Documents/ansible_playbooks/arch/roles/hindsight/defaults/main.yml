---
hindsight_enabled: true
hindsight_image: ghcr.io/vectorize-io/hindsight:latest
hindsight_dir: /opt/hindsight

# API (:8888) and the bundled control-plane UI (:9999).
hindsight_api_port: 8888
hindsight_ui_port: 9999

# pgvector image; the volume path below is pinned to the 18 layout on purpose.
hindsight_db_image: pgvector/pgvector:pg18
hindsight_db_name: hindsight_db
hindsight_db_user: hindsight_user

# LLM: the exl3 (TabbyAPI) OpenAI-compatible endpoint of the exllamav3 role;
# playbooks/ai.yml wires model / base_url / api_key to it.
hindsight_llm_provider: openai
hindsight_llm_model: ""
hindsight_llm_base_url: ""
hindsight_llm_api_key: ""

# hindsight_db_password lives in inventory/group_vars/secrets.sops.yml
# (age-encrypted, loaded by the playbook's community.sops.load_vars pre_task;
# run `sops -e` with SOPS_AGE_KEY_FILE to rotate it).
# The DB password ends up inside a DSN — keep it alphanumeric.