---
- name: Install Node.js prerequisites
  become: true
  tags:
    - pkg
    - npm
  community.general.pacman:
    name: "{{ npm_pacman_packages }}"
    state: present

# Global npm install lands in /usr/lib/node_modules with root ownership, which
# the npm module handles itself: no become_user, no hand-rolled prefix.
# state: latest keeps the global CLI packages upgraded on each apply.
- name: Install global npm packages
  become: true
  tags:
    - pkg
    - npm
  community.general.npm:
    name: "{{ item }}"
    global: true
    state: latest
  loop: "{{ npm_packages }}"
