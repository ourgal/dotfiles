---
nvfetcher_bins_enabled: true
# nvfetcher pins live in the chezmoi repo root and are refreshed by
# .github/workflows/nvfetcher.yaml. Ansible only consumes the generated file.
nvfetcher_bins_sources: "{{ lookup('env', 'HOME') }}/.local/share/chezmoi/_sources/generated.json"
nvfetcher_bins_prefix: "{{ ansible_facts.env.HOME }}/.local"
nvfetcher_bins_bin_dir: "{{ nvfetcher_bins_prefix }}/bin"
nvfetcher_bins_libexec_dir: "{{ nvfetcher_bins_prefix }}/libexec"
nvfetcher_bins_data_dir: "{{ ansible_facts.env.HOME }}/.local/share/nvfetcher-bins"
nvfetcher_bins_cache_dir: "{{ ansible_facts.env.HOME }}/.cache/ansible/nvfetcher-bins"
nvfetcher_bins_tags: [pkg, nvfetcher_bins]
nvfetcher_bins_remove_aur: true
nvfetcher_bins_seanime_service: true
# Runtime libraries Handy's .deb expects on Arch (AUR used these names;
# libappindicator replaces the AUR-only libappindicator-gtk3).
nvfetcher_bins_handy_deps:
  - alsa-lib
  - cairo
  - gcc-libs
  - gdk-pixbuf2
  - glib2
  - glibc
  - gtk3
  - gtk-layer-shell
  - hicolor-icon-theme
  - libappindicator
  - libsoup3
  - openblas
  - openssl
  - vulkan-icd-loader
  - webkit2gtk-4.1
nvfetcher_bins_retired_aur_packages:
  - aliae-bin
  - dufs-bin
  - geminicommit-bin
  - handy-bin
  - seanime-bin
  - tuios-bin
  - pi-coding-agent-bin
  - herdr-bin
  - maki-bin
  - rtk-bin
  - kanata-bin
  - oh-my-pi-bin

# install: flat_tar (single binary at archive root) | raw (already a binary)
#          dir (bundle extracted to libexec, then linked)
#          zip (named members) | deb (payload stripped into the prefix)
# paths: executables expected under bin_dir; libexec_paths: under libexec_dir.
# A missing path triggers reinstall even when the pin has not changed.
nvfetcher_bins:
  - name: aliae
    install: raw
    paths: [aliae]
  - name: dufs
    install: flat_tar
    include: dufs
    paths: [dufs]
  - name: geminicommit
    install: flat_tar
    include: gmc
    paths: [gmc]
  - name: seanime
    install: flat_tar
    include: ./seanime
    paths: [seanime]
  - name: tuios
    install: flat_tar
    include: tuios
    paths: [tuios]
  - name: handy
    install: deb
    paths: [handy]
    desktop: share/applications/Handy.desktop
  - name: herdr
    install: raw
    paths: [herdr]
  - name: maki
    install: flat_tar
    include: maki
    paths: [maki]
  - name: rtk
    install: flat_tar
    include: rtk
    paths: [rtk]
  - name: pi-coding-agent
    install: dir
    include: "pi/*"
    binary: pi
    paths: [pi]
    libexec_paths: [pi/pi]
  - name: kanata
    install: zip
    files:
      - src: kanata_linux_x64
        dest: kanata
      - src: kanata_linux_cmd_allowed_x64
        dest: kanata_cmd_allowed
    paths: [kanata, kanata_cmd_allowed]
  - name: oh-my-pi
    install: raw
    binary: omp
    paths: [omp]
  - name: lefthook
    install: raw
    paths: [lefthook]
