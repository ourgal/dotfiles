---
scls_enabled: true

# Prebuilt release from ourgal/simple-completion-language-server, which builds
# upstream estin/simple-completion-language-server from main. The tag is a
# commit hash, so bump scls_release to pick up newer upstream builds.
scls_release: "scls-73e6789f"
scls_archive: "{{ scls_release }}-x86_64-unknown-linux-gnu.tar.gz"
scls_archive_path: "/tmp/{{ scls_archive }}"
scls_source_dir: "/tmp/{{ scls_release }}-x86_64-unknown-linux-gnu"
scls_download_url: "https://v6.gh-proxy.org/https://github.com/ourgal/simple-completion-language-server/releases/download/{{ scls_release }}/{{ scls_archive }}"  # noqa: yaml[line-length]
scls_sha256: "dab18b5a77b353d99ab3b639562b6647775d11614f039cafa1b5aadff286bb3c"

# Helix config resolves this exact binary name via lookPath.
scls_binary: /usr/local/bin/simple-completion-language-server
scls_version_file: /usr/local/share/scls/version
