---
- name: Prepare the AUR builder
  when: aur_packages | length > 0
  block:
    - name: Create the AUR builder group
      become: true
      tags:
        - pkg
        - aur
      ansible.builtin.group:
        name: "{{ aur_builder_user }}"
        system: true

    - name: Create the AUR builder user
      become: true
      tags:
        - pkg
        - aur
      ansible.builtin.user:
        name: "{{ aur_builder_user }}"
        group: "{{ aur_builder_user }}"
        home: "{{ aur_builder_home }}"
        create_home: true
        shell: /bin/bash
        system: true

    # Persistent: the module shells out to `sudo pacman` on every run and
    # there is no tty to answer a prompt.
    - name: Allow the AUR builder to run pacman without a password
      become: true
      tags:
        - pkg
        - aur
      community.general.sudoers:
        name: "{{ aur_sudoers_name }}"
        state: present
        user: "{{ aur_builder_user }}"
        commands: /usr/bin/pacman
        nopassword: true

# seanime-bin ships the user unit /usr/lib/systemd/user/seanime.service.
- name: Enable seanime user service
  become: true
  become_user: "{{ aur_seanime_user }}"
  tags:
    - service
    - aur
  when: "'seanime-bin' in aur_packages"
  ansible.builtin.systemd_service:
    scope: user
    name: seanime.service
    enabled: true
    state: started
    daemon_reload: true
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.user_uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ ansible_facts.user_uid }}/bus"

# The packaged unit starts with a clean environment, and the user service starts
# before the graphical login injects DISPLAY/XAUTHORITY into the user manager,
# so PassEnvironment has nothing to pass. Set them explicitly in a drop-in that
# survives package upgrades instead.
- name: Create seanime service drop-in directory
  become: true
  become_user: "{{ aur_seanime_user }}"
  tags:
    - service
    - aur
  when: "'seanime-bin' in aur_packages"
  ansible.builtin.file:
    path: "{{ ansible_facts.user_dir }}/.config/systemd/user/seanime.service.d"
    state: directory
    mode: "0755"

- name: Pass the graphical session into seanime's mpv
  become: true
  become_user: "{{ aur_seanime_user }}"
  tags:
    - service
    - aur
  when: "'seanime-bin' in aur_packages"
  ansible.builtin.copy:
    dest: "{{ ansible_facts.user_dir }}/.config/systemd/user/seanime.service.d/override.conf"
    content: |
      [Service]
      # seanime spawns mpv, which needs DISPLAY and the Xauthority cookie to
      # open a window. The user service starts before the graphical login puts
      # these into the user manager, so set them directly.
      Environment=DISPLAY=:0
      Environment=XAUTHORITY=/run/user/%U/lyxauth
    mode: "0644"
  register: aur_seanime_dropin

- name: Restart seanime when its environment drop-in changes
  become: true
  become_user: "{{ aur_seanime_user }}"
  tags:
    - service
    - aur
  when:
    - "'seanime-bin' in aur_packages"
    - aur_seanime_dropin.changed | default(false)
  ansible.builtin.systemd_service:
    scope: user
    name: seanime.service
    state: restarted
    daemon_reload: true
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.user_uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ ansible_facts.user_uid }}/bus"

- name: Upgrade AUR packages
  become: true
  become_user: "{{ aur_builder_user }}"
  tags:
    - pkg
    - aur
  kewlfft.aur.aur:
    use: "{{ aur_helper }}"
    upgrade: true
    # --aur upgrades every installed AUR package, including those not listed
    # in aur_packages; the pacman role already handles the repo packages.
    aur_only: true
    update_cache: true

- name: Install AUR packages
  become: true
  become_user: "{{ aur_builder_user }}"
  tags:
    - pkg
    - aur
  when: aur_packages | length > 0
  kewlfft.aur.aur:
    name: "{{ aur_packages }}"
    use: "{{ aur_helper }}"
    state: present

# The packaged espanso.service is an X11 user unit that starts before the
# graphical login injects DISPLAY/XAUTHORITY into the user manager, so pass
# them through a drop-in (same approach as seanime above).
- name: Create the espanso service drop-in directory
  become: true
  become_user: "{{ aur_espanso_user }}"
  tags:
    - service
    - aur
  when: "'espanso-x11-bin' in aur_packages"
  ansible.builtin.file:
    path: "{{ ansible_facts.user_dir }}/.config/systemd/user/espanso.service.d"
    state: directory
    mode: "0755"

- name: Pass the graphical session into espanso
  become: true
  become_user: "{{ aur_espanso_user }}"
  tags:
    - service
    - aur
  when: "'espanso-x11-bin' in aur_packages"
  ansible.builtin.copy:
    dest: "{{ ansible_facts.user_dir }}/.config/systemd/user/espanso.service.d/override.conf"
    content: |
      [Service]
      Environment=DISPLAY=:0
      Environment=XAUTHORITY=/run/user/%U/lyxauth
    mode: "0644"
  register: aur_espanso_dropin

- name: Enable and start the espanso user service
  become: true
  become_user: "{{ aur_espanso_user }}"
  tags:
    - service
    - aur
  when: "'espanso-x11-bin' in aur_packages"
  ansible.builtin.systemd_service:
    scope: user
    name: espanso.service
    enabled: true
    state: started
    daemon_reload: true
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.user_uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ ansible_facts.user_uid }}/bus"

- name: Restart espanso when its environment drop-in changes
  become: true
  become_user: "{{ aur_espanso_user }}"
  tags:
    - service
    - aur
  when:
    - "'espanso-x11-bin' in aur_packages"
    - aur_espanso_dropin.changed | default(false)
  ansible.builtin.systemd_service:
    scope: user
    name: espanso.service
    state: restarted
    daemon_reload: true
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.user_uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ ansible_facts.user_uid }}/bus"
