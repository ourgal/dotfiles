---
aur_enabled: true
# Package names exactly as published on https://aur.archlinux.org.
# Empty list is a no-op: the builder user is only created when there is work.
aur_packages:
  - dufs-bin
  - geminicommit-bin
  - seanime-bin
  - qoder-cli-cn-bin
  - tuios-bin
  - ungoogled-chromium-bin
  - aliae-bin
  # Same prebuilt binary as the Windows scoop main/pi-coding-agent.
  - pi-coding-agent-bin
  # Same prebuilt binary as the Windows scoop main/oh-my-pi.
  - oh-my-pi-bin
  # Supervise multiple coding agents in one terminal; config is chezmoi-managed.
  - herdr-bin
  # Drop-in libfprint replacement carrying the Goodix 27c6:5584 (Milan) driver
  # for the Surface Pro 4 fingerprint scanner; used by the fingerprint role.
  - libfprint-goodix55b4
# Helper the module drives; must already be installed (paru role).
aur_helper: paru
aur_builder_user: aur-builder
aur_builder_home: /var/tmp/aur-builder
aur_sudoers_name: aur-build
