- name: Check winget availability
  tags:
    - pkg
    - winget
  ansible.windows.win_command:
    argv:
      - winget
      - --version
  register: windows_winget_winget_version
  changed_when: false
  failed_when: false
  check_mode: false

- name: Verify winget is available
  tags:
    - pkg
    - winget
  ansible.builtin.assert:
    that: windows_winget_winget_version.rc | default(-1) == 0
    fail_msg: winget is not available, install App Installer first

- name: Install DSC v3
  tags:
    - dsc
    - pkg
    - winget
  when: windows_winget_install_dsc | bool
  ansible.windows.win_command:
    argv:
      - winget
      - install
      - --id=Microsoft.DSC
      - --exact
      - --source=winget
      - --scope=user
      - --installer-type=portable
      - --accept-package-agreements
      - --accept-source-agreements
      - --disable-interactivity
    creates: "{{ windows_winget_dsc_executable }}"

- name: Locate winget installation directory
  tags:
    - pkg
    - winget
  when: windows_winget_packages | length > 0
  ansible.windows.win_shell: Split-Path -Parent (Get-Command winget).Source
  register: windows_winget_dir
  changed_when: false
  check_mode: false

- name: Generate WinGet DSC resource manifests
  tags:
    - dsc
    - pkg
    - winget
  when: windows_winget_packages | length > 0
  ansible.windows.win_command:
    argv:
      - winget
      - dscv3
      - --manifest
      - --output
      - "{{ windows_winget_dsc_resource_path }}"
  changed_when: false
  check_mode: false

- name: Manage winget packages with DSC
  tags:
    - dsc
    - pkg
    - winget
  when: windows_winget_packages | length > 0
  ansible.windows.dsc3:
    executable: "{{ windows_winget_dsc_executable }}"
    resource_path:
      - "{{ windows_winget_dsc_resource_path }}"
      - "{{ windows_winget_dir.stdout | trim }}"
    config: "{{ lookup('ansible.builtin.template', 'dsc_config.yml.j2') | from_yaml }}"
