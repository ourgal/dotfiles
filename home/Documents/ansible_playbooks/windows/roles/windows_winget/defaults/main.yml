# Packages are winget IDs, or mappings with id (or name), state, version,
# source, accept_agreements, install_mode, and match_option keys.
windows_winget_packages: []
windows_winget_state: present
windows_winget_source: winget
windows_winget_accept_agreements: true
windows_winget_install_mode: silent
windows_winget_match_option: equalsCaseInsensitive

# DSC v3 is bootstrapped through winget as a user-scoped portable package.
# Point dsc_executable at another copy if DSC is managed elsewhere.
windows_winget_install_dsc: true
windows_winget_dsc_executable: "{{ ansible_env.LOCALAPPDATA }}\\Microsoft\\WinGet\\Links\\dsc.exe"
windows_winget_dsc_resource_path: "{{ ansible_env.LOCALAPPDATA }}\\Microsoft\\WinGet\\DscResources"
