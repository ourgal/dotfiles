---
github_binaries_bin_dir: "{{ ansible_facts.env.HOME }}/.local/bin"
github_binaries_data_dir: "{{ ansible_facts.env.HOME }}/.local/share/github-binaries"
github_binaries_cache_dir: "{{ ansible_facts.env.HOME }}/.cache/ansible/github-binaries"
github_binaries_tags: [pkg, github_binaries]

# Not packaged in termux-main. These replace the GitHub release downloads that
# the android-only chezmoi run_onchange scripts used to perform. The URL doubles
# as the installed-version marker, so bumping a version reinstalls the binary.
github_binaries:
  - name: crush
    url: "https://v6.gh-proxy.org/https://github.com/charmbracelet/crush/releases/download/v0.95.0/crush_0.95.0_Android_arm64.tar.gz"
    include: "*/crush"
  - name: lazyrsync
    url: "https://v6.gh-proxy.org/https://github.com/westpoint-io/lazyrsync/releases/download/v0.3.0/lazyrsync-aarch64-unknown-linux-musl.tar.gz"
    include: "lazyrsync"
  - name: maki
    url: "https://v6.gh-proxy.org/https://github.com/tontinton/maki/releases/download/v0.7.3/maki-v0.7.3-aarch64-unknown-linux-musl.tar.gz"
    include: "maki"
