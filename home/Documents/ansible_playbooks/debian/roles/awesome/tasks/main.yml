# chezmoi:template:left-delimiter=[[ right-delimiter=]]
---
- name: Install awesome
  become: true
  ansible.builtin.apt:
    update_cache: true
    pkg: "{{ awesome_packages }}"

- name: Create awesome session wrapper
  vars:
    scale_f: "{{ awesome_scales[inventory_hostname] | default(1) | float }}"
    transform: "{{ (1.0 / scale_f) | round(4) }}"
  become: true
  ansible.builtin.copy:
    dest: "{{ awesome_session_cmd }}"
    mode: "0755"
    content: |
      #!/bin/sh
      {% if scale_f | float != 1.0 %}
      # fractional scaling: down-scale the CRTC and compensate font DPI
      output=$(xrandr | awk '/ connected primary/ {print $1; exit}')
      xrandr --output "$output" --scale {{ transform }}x{{ transform }}
      echo 'Xft.dpi: {{ ((96 * (scale_f | float)) | round(0, 'ceil')) | int }}' | xrdb -merge
      {% endif %}
      exec awesome

- name: Write awesome session
  become: true
  ansible.builtin.copy:
    dest: /usr/share/xsessions/awesome.desktop
    mode: "0644"
    content: |
      [Desktop Entry]
      Name=awesome
      Comment=Highly configurable framework window manager
      TryExec=awesome
      Exec={{ awesome_session_cmd }}
      Type=Application
      Icon=/usr/share/pixmaps/awesome.xpm
      Keywords=Window manager

- name: Remove greetd startx wrapper
  become: true
  ansible.builtin.file:
    path: /usr/local/bin/awesome-session
    state: absent
