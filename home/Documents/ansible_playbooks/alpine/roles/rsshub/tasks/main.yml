---
- name: Create the rsshub stack directory
  become: true
  ansible.builtin.file:
    path: "{{ rsshub_dir }}"
    state: directory
    mode: '0700'

- name: Deploy the rsshub compose file
  become: true
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ rsshub_dir }}/docker-compose.yml"
    mode: '0600'

# No community.docker dependency on purpose: the CLI is idempotent here.
- name: Start the rsshub stack
  become: true
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans
    chdir: "{{ rsshub_dir }}"
  changed_when: false
