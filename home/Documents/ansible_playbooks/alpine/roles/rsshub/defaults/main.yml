---
rsshub_enabled: false
rsshub_image: v6.gh-proxy.org/docker/diygod/rsshub:chromium-bundled
rsshub_redis_image: redis:alpine
rsshub_dir: /opt/rsshub

rsshub_http_port: 1200
# Seconds a fetched feed stays in redis.
rsshub_cache_expire: 3600

# Bilibili route cookies: {uid: cookie}. Needed by /bilibili/user/dynamic/:uid and
# recommended for /bilibili/user/video/:uid (SESSDATA alone is enough for both).
# Values live in inventory/group_vars/secrets.sops.yml (age-encrypted, auto-loaded
# by the community.sops vars plugin): `cd alpine && sops edit inventory/group_vars/secrets.sops.yml`.
# If a route complains about a missing browser (docs mark it "依赖 Puppeteer"),
# switch rsshub_image to the `:chromium-bundled` tag instead of adding Playwright.
rsshub_bilibili_cookies: {}

# Any other RSSHub env var (WENKU8_COOKIE, DOUBAN_COOKIE, ...): {NAME: value}.
# Sourced from secrets.sops.yml next to rsshub_bilibili_cookies; empty values skipped.
rsshub_env: {}
