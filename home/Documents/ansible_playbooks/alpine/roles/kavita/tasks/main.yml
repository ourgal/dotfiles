---
- name: Create the kavita stack directory
  become: true
  ansible.builtin.file:
    path: "{{ kavita_dir }}"
    state: directory
    mode: '0700'

- name: Create the kavita config directory
  become: true
  ansible.builtin.file:
    path: "{{ kavita_config_dir }}"
    state: directory
    owner: "{{ kavita_uid }}"
    group: "{{ kavita_gid }}"
    mode: '0700'

- name: Deploy the kavita compose file
  become: true
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ kavita_dir }}/docker-compose.yml"
    mode: '0600'

# No community.docker dependency on purpose: the CLI is idempotent here.
- name: Start the kavita stack
  become: true
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans
    chdir: "{{ kavita_dir }}"
  changed_when: false
