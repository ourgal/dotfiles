---
- name: Create the vaultwarden stack directory
  become: true
  ansible.builtin.file:
    path: "{{ vaultwarden_dir }}"
    state: directory
    mode: '0700'

- name: Create the vaultwarden data directory
  become: true
  ansible.builtin.file:
    path: "{{ vaultwarden_data_dir }}"
    state: directory
    owner: "{{ vaultwarden_uid }}"
    group: "{{ vaultwarden_gid }}"
    mode: '0700'

- name: Deploy the vaultwarden compose file
  become: true
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ vaultwarden_dir }}/docker-compose.yml"
    mode: '0600'

# No community.docker dependency on purpose: the CLI is idempotent here.
- name: Start the vaultwarden stack
  become: true
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans
    chdir: "{{ vaultwarden_dir }}"
  changed_when: false
