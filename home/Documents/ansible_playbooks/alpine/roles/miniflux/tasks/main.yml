---
- name: Create the miniflux stack directory
  become: true
  ansible.builtin.file:
    path: "{{ miniflux_dir }}"
    state: directory
    mode: '0700'

- name: Deploy the miniflux compose file
  become: true
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ miniflux_dir }}/docker-compose.yml"
    mode: '0600'

# No community.docker dependency on purpose: the CLI is idempotent here.
- name: Start the miniflux stack
  become: true
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans
    chdir: "{{ miniflux_dir }}"
  changed_when: false
