---
- name: Create the lanraragi stack directory
  become: true
  ansible.builtin.file:
    path: "{{ lanraragi_dir }}"
    state: directory
    mode: '0700'

- name: Create the lanraragi content and thumbnail directories
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ lanraragi_uid }}"
    group: "{{ lanraragi_gid }}"
    mode: '0755'
  loop:
    - "{{ lanraragi_content_dir }}"
    - "{{ lanraragi_thumb_dir }}"
    - "{{ lanraragi_plugins_dir }}"

- name: Create the lanraragi database directory
  become: true
  ansible.builtin.file:
    path: "{{ lanraragi_database_dir }}"
    state: directory
    owner: "{{ lanraragi_uid }}"
    group: "{{ lanraragi_gid }}"
    mode: '0700'

- name: Deploy the lanraragi compose file
  become: true
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ lanraragi_dir }}/docker-compose.yml"
    mode: '0600'

# No community.docker dependency on purpose: the CLI is idempotent here.
- name: Start the lanraragi stack
  become: true
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans
    chdir: "{{ lanraragi_dir }}"
  changed_when: false
