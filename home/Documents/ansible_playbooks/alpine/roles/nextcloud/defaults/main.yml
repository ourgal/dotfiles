---
nextcloud_enabled: false
nextcloud_image: v6.gh-proxy.org/docker/library/nextcloud:apache
nextcloud_db_image: mariadb:lts
nextcloud_redis_image: redis:alpine
nextcloud_dir: /opt/nextcloud

# Address users reach the web UI on; override in inventory for a real hostname.
# Do NOT rely on this fact alone when a transparent proxy owns the default route:
# mihomo's TUN (`Meta`, 198.18.0.1/30) wins default_ipv4 and Nextcloud then
# rejects the LAN address. `nextcloud_domain` is pinned in group_vars/all.yml;
# localhost is always trusted so `docker exec ... occ` keeps working.
nextcloud_domain: "{{ ansible_facts.get('default_ipv4', {}).get('address', 'localhost') }}"
nextcloud_http_port: 8080

# Credentials live in inventory/group_vars/secrets.sops.yml (age-encrypted, loaded by
# the playbook's community.sops.load_vars pre_task): `make sops`.
# NEXTCLOUD_ADMIN_* only applies while the instance is uninstalled; later changes
# (and extra users) go through the web UI.
nextcloud_admin_username: admin
nextcloud_admin_password: ""
nextcloud_db_name: nextcloud
nextcloud_db_username: nextcloud
nextcloud_db_password: ""
nextcloud_db_root_password: ""
