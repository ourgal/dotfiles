---
- name: Create the soft-serve stack directory
  become: true
  ansible.builtin.file:
    path: "{{ soft_serve_dir }}"
    state: directory
    mode: '0700'

- name: Create the soft-serve data directory
  become: true
  ansible.builtin.file:
    path: "{{ soft_serve_data_dir }}"
    state: directory
    mode: '0700'

- name: Deploy the soft-serve compose file
  become: true
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ soft_serve_dir }}/docker-compose.yml"
    mode: '0600'

# No community.docker dependency on purpose: the CLI is idempotent here.
- name: Start the soft-serve stack
  become: true
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans
    chdir: "{{ soft_serve_dir }}"
  changed_when: false
