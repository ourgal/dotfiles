---
- name: Create the wallabag stack directory
  become: true
  ansible.builtin.file:
    path: "{{ wallabag_dir }}"
    state: directory
    mode: '0700'

- name: Create the wallabag data directory
  become: true
  ansible.builtin.file:
    path: "{{ wallabag_data_dir }}"
    state: directory
    mode: '0700'

- name: Create the wallabag images directory
  become: true
  ansible.builtin.file:
    path: "{{ wallabag_images_dir }}"
    state: directory
    mode: '0755'

# Only seed the schema on the first run; re-running the installer on an
# existing database is not supported.
- name: Check whether the wallabag database exists
  become: true
  ansible.builtin.stat:
    path: "{{ wallabag_data_dir }}/db/wallabag.sqlite"
  register: wallabag_db

- name: Deploy the wallabag compose file
  become: true
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ wallabag_dir }}/docker-compose.yml"
    mode: '0600'

# No community.docker dependency on purpose: the CLI is idempotent here.
- name: Start the wallabag stack
  become: true
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans
    chdir: "{{ wallabag_dir }}"
  changed_when: false
