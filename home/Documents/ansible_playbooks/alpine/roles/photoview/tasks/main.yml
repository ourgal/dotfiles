---
- name: Create the photoview stack directory
  become: true
  ansible.builtin.file:
    path: "{{ photoview_dir }}"
    state: directory
    mode: '0700'

- name: Create the photoview data directories
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ photoview_uid }}"
    group: "{{ photoview_gid }}"
    mode: '0700'
  loop:
    - "{{ photoview_database_dir }}"
    - "{{ photoview_cache_dir }}"

- name: Deploy the photoview compose file
  become: true
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ photoview_dir }}/docker-compose.yml"
    mode: '0600'

# No community.docker dependency on purpose: the CLI is idempotent here.
- name: Start the photoview stack
  become: true
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans
    chdir: "{{ photoview_dir }}"
  changed_when: false
