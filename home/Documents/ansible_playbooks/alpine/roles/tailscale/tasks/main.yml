---
- name: Install tailscale
  become: true
  community.general.apk:
    name: "{{ tailscale_packages }}"
    state: present
    update_cache: true

- name: Enable IP forwarding for subnet routing and exit node
  become: true
  ansible.builtin.blockinfile:
    path: /etc/sysctl.conf
    marker: "# {mark} ANSIBLE MANAGED BLOCK tailscale"
    block: |
      net.ipv4.ip_forward = 1
      net.ipv6.conf.all.forwarding = 1
  notify: Apply sysctl settings

- name: Enable and start the tailscale service
  become: true
  ansible.builtin.service:
    name: tailscale
    enabled: true
    state: started

- name: Check the tailscale connection state
  when: tailscale_auth_key | length > 0
  ansible.builtin.command:
    cmd: tailscale status --json
  register: tailscale_status
  changed_when: false
  failed_when: false

- name: Connect the node to the tailnet
  when:
    - tailscale_auth_key | length > 0
    - (tailscale_status.rc != 0) or ((tailscale_status.stdout | from_json).BackendState | default('') != 'Running')
  become: true
  ansible.builtin.command:
    argv: "{{ ['tailscale', 'up', '--auth-key=' ~ tailscale_auth_key] + tailscale_up_args }}"
  no_log: true
  changed_when: true