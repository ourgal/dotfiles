---
- name: Create the wifi-card stack directory
  become: true
  ansible.builtin.file:
    path: "{{ wifi_card_dir }}"
    state: directory
    mode: '0700'

- name: Deploy the wifi-card compose file
  become: true
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ wifi_card_dir }}/docker-compose.yml"
    mode: '0600'

# No community.docker dependency on purpose: the CLI is idempotent here.
- name: Start the wifi-card stack
  become: true
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans
    chdir: "{{ wifi_card_dir }}"
  changed_when: false
