---
- name: Create the freshrss stack directory
  become: true
  ansible.builtin.file:
    path: "{{ freshrss_dir }}"
    state: directory
    mode: '0700'

- name: Deploy the freshrss compose file
  become: true
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ freshrss_dir }}/docker-compose.yml"
    mode: '0600'

# No community.docker dependency on purpose: the CLI is idempotent here.
- name: Start the freshrss stack
  become: true
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans
    chdir: "{{ freshrss_dir }}"
  changed_when: false
