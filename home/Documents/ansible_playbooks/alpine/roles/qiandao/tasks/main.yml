---
- name: Create the qiandao stack directory
  become: true
  ansible.builtin.file:
    path: "{{ qiandao_dir }}"
    state: directory
    mode: '0700'

- name: Create the qiandao data directories
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0700'
  loop:
    - "{{ qiandao_data_dir }}/config"
    - "{{ qiandao_data_dir }}/redis"

- name: Deploy the qiandao compose file
  become: true
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ qiandao_dir }}/docker-compose.yml"
    mode: '0600'

# No community.docker dependency on purpose: the CLI is idempotent here.
- name: Start the qiandao stack
  become: true
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans
    chdir: "{{ qiandao_dir }}"
  changed_when: false
