---
- name: Create the dufs stack directory
  become: true
  ansible.builtin.file:
    path: "{{ dufs_dir }}"
    state: directory
    mode: '0700'

- name: Create the dufs share directory
  become: true
  ansible.builtin.file:
    path: "{{ dufs_data_dir }}"
    state: directory
    mode: '0755'

- name: Deploy the dufs compose file
  become: true
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ dufs_dir }}/docker-compose.yml"
    mode: '0600'

# No community.docker dependency on purpose: the CLI is idempotent here.
- name: Start the dufs stack
  become: true
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans
    chdir: "{{ dufs_dir }}"
  changed_when: false
