---
- name: Create the pairdrop stack directory
  become: true
  ansible.builtin.file:
    path: "{{ pairdrop_dir }}"
    state: directory
    mode: '0700'

- name: Create the pairdrop config directory
  become: true
  ansible.builtin.file:
    path: "{{ pairdrop_config_dir }}"
    state: directory
    owner: "{{ pairdrop_uid }}"
    group: "{{ pairdrop_gid }}"
    mode: '0750'

- name: Deploy the pairdrop compose file
  become: true
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ pairdrop_dir }}/docker-compose.yml"
    mode: '0600'

# No community.docker dependency on purpose: the CLI is idempotent here.
- name: Start the pairdrop stack
  become: true
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans
    chdir: "{{ pairdrop_dir }}"
  changed_when: false
