---
- name: Create the jellyseerr stack directory
  become: true
  ansible.builtin.file:
    path: "{{ jellyseerr_dir }}"
    state: directory
    mode: '0700'

- name: Create the jellyseerr config directory
  become: true
  ansible.builtin.file:
    path: "{{ jellyseerr_config_dir }}"
    state: directory
    owner: "{{ jellyseerr_uid }}"
    group: "{{ jellyseerr_gid }}"
    mode: '0700'

- name: Deploy the jellyseerr compose file
  become: true
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ jellyseerr_dir }}/docker-compose.yml"
    mode: '0600'

# No community.docker dependency on purpose: the CLI is idempotent here.
- name: Start the jellyseerr stack
  become: true
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans
    chdir: "{{ jellyseerr_dir }}"
  changed_when: false
