---
- name: Create the netdata stack directory
  become: true
  ansible.builtin.file:
    path: "{{ netdata_dir }}"
    state: directory
    mode: '0700'

- name: Create the netdata state directories
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ netdata_config_dir }}"
    - "{{ netdata_lib_dir }}"
    - "{{ netdata_cache_dir }}"

- name: Deploy the netdata compose file
  become: true
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ netdata_dir }}/docker-compose.yml"
    mode: '0600'

# No community.docker dependency on purpose: the CLI is idempotent here.
- name: Start the netdata stack
  become: true
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans
    chdir: "{{ netdata_dir }}"
  changed_when: false
