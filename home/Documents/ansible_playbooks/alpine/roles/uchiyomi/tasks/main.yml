---
- name: Create the uchiyomi stack directory
  become: true
  ansible.builtin.file:
    path: "{{ uchiyomi_dir }}"
    state: directory
    mode: '0700'

- name: Create the uchiyomi media directories
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ uchiyomi_uid }}"
    group: "{{ uchiyomi_gid }}"
    mode: '0755'
  loop:
    - "{{ uchiyomi_library_dir }}"
    - "{{ uchiyomi_downloads_dir }}"

- name: Create the uchiyomi state directories
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ uchiyomi_uid }}"
    group: "{{ uchiyomi_gid }}"
    mode: '0700'
  loop:
    - "{{ uchiyomi_data_dir }}"
    - "{{ uchiyomi_config_dir }}"
    - "{{ uchiyomi_cache_dir }}"
    - "{{ uchiyomi_backups_dir }}"
    - "{{ uchiyomi_suwayomi_dir }}"

- name: Deploy the uchiyomi compose file
  become: true
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ uchiyomi_dir }}/docker-compose.yml"
    mode: '0600'

# No community.docker dependency on purpose: the CLI is idempotent here.
- name: Start the uchiyomi stack
  become: true
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans
    chdir: "{{ uchiyomi_dir }}"
  changed_when: false
