---
- name: Enable the networking service
  become: true
  ansible.builtin.service:
    name: networking
    enabled: true

- name: Configure the static network interface
  become: true
  ansible.builtin.template:
    src: interfaces.j2
    dest: /etc/network/interfaces
    owner: root
    group: root
    mode: '0644'
  notify: Restart networking

- name: Configure DNS resolvers
  become: true
  ansible.builtin.template:
    src: resolv.conf.j2
    dest: /etc/resolv.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart networking