---
- name: Create the siyuan stack directory
  become: true
  ansible.builtin.file:
    path: "{{ siyuan_dir }}"
    state: directory
    mode: '0700'

- name: Create the siyuan workspace directory
  become: true
  ansible.builtin.file:
    path: "{{ siyuan_workspace_dir }}"
    state: directory
    owner: "{{ siyuan_uid }}"
    group: "{{ siyuan_gid }}"
    mode: '0700'

- name: Deploy the siyuan compose file
  become: true
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ siyuan_dir }}/docker-compose.yml"
    mode: '0600'

# No community.docker dependency on purpose: the CLI is idempotent here.
- name: Start the siyuan stack
  become: true
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans
    chdir: "{{ siyuan_dir }}"
  changed_when: false
