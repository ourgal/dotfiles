---
- name: Create the changedetection stack directory
  become: true
  ansible.builtin.file:
    path: "{{ changedetection_dir }}"
    state: directory
    mode: '0700'

- name: Create the changedetection datastore directory
  become: true
  ansible.builtin.file:
    path: "{{ changedetection_datastore_dir }}"
    state: directory
    owner: "{{ changedetection_uid }}"
    group: "{{ changedetection_gid }}"
    mode: '0700'

- name: Deploy the changedetection compose file
  become: true
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ changedetection_dir }}/docker-compose.yml"
    mode: '0600'

# No community.docker dependency on purpose: the CLI is idempotent here.
- name: Start the changedetection stack
  become: true
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans
    chdir: "{{ changedetection_dir }}"
  changed_when: false
