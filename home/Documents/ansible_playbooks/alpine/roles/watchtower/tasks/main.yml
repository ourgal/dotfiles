---
- name: Create the watchtower stack directory
  become: true
  ansible.builtin.file:
    path: "{{ watchtower_dir }}"
    state: directory
    mode: '0700'

- name: Deploy the watchtower compose file
  become: true
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ watchtower_dir }}/docker-compose.yml"
    mode: '0600'

# No community.docker dependency on purpose: the CLI is idempotent here.
- name: Start the watchtower stack
  become: true
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans
    chdir: "{{ watchtower_dir }}"
  changed_when: false
