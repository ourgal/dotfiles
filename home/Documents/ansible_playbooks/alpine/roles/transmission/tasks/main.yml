---
- name: Create the transmission stack directory
  become: true
  ansible.builtin.file:
    path: "{{ transmission_dir }}"
    state: directory
    mode: '0700'

- name: Create the transmission config directory
  become: true
  ansible.builtin.file:
    path: "{{ transmission_config_dir }}"
    state: directory
    owner: "{{ transmission_uid }}"
    group: "{{ transmission_gid }}"
    mode: '0700'

- name: Create the transmission download and watch directories
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ transmission_uid }}"
    group: "{{ transmission_gid }}"
    mode: '0755'
  loop:
    - "{{ transmission_downloads_dir }}"
    - "{{ transmission_watch_dir }}"

- name: Deploy the transmission compose file
  become: true
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ transmission_dir }}/docker-compose.yml"
    mode: '0600'

# No community.docker dependency on purpose: the CLI is idempotent here.
- name: Start the transmission stack
  become: true
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans
    chdir: "{{ transmission_dir }}"
  changed_when: false
