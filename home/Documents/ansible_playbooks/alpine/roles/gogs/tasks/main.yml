---
- name: Create the gogs stack directory
  become: true
  ansible.builtin.file:
    path: "{{ gogs_dir }}"
    state: directory
    mode: '0700'

- name: Deploy the gogs compose file
  become: true
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ gogs_dir }}/docker-compose.yml"
    mode: '0600'

# No community.docker dependency on purpose: the CLI is idempotent here.
- name: Start the gogs stack
  become: true
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans
    chdir: "{{ gogs_dir }}"
  changed_when: false
