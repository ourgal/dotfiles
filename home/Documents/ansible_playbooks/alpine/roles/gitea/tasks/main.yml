---
- name: Create the gitea stack directory
  become: true
  ansible.builtin.file:
    path: "{{ gitea_dir }}"
    state: directory
    mode: '0700'

- name: Deploy the gitea compose file
  become: true
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ gitea_dir }}/docker-compose.yml"
    mode: '0600'

# No community.docker dependency on purpose: the CLI is idempotent here.
- name: Start the gitea stack
  become: true
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans
    chdir: "{{ gitea_dir }}"
  changed_when: false
