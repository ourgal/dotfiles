---
- name: Create the cloudreve stack directory
  become: true
  ansible.builtin.file:
    path: "{{ cloudreve_dir }}"
    state: directory
    mode: '0700'

- name: Create the cloudreve data directory
  become: true
  ansible.builtin.file:
    path: "{{ cloudreve_data_dir }}"
    state: directory
    owner: "{{ cloudreve_uid }}"
    group: "{{ cloudreve_gid }}"
    mode: '0750'

- name: Deploy the cloudreve compose file
  become: true
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ cloudreve_dir }}/docker-compose.yml"
    mode: '0600'

# No community.docker dependency on purpose: the CLI is idempotent here.
- name: Start the cloudreve stack
  become: true
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans
    chdir: "{{ cloudreve_dir }}"
  changed_when: false
