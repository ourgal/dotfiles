---
- name: Create the cyberchef stack directory
  become: true
  ansible.builtin.file:
    path: "{{ cyberchef_dir }}"
    state: directory
    mode: '0700'

- name: Deploy the cyberchef compose file
  become: true
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ cyberchef_dir }}/docker-compose.yml"
    mode: '0600'

# No community.docker dependency on purpose: the CLI is idempotent here.
- name: Start the cyberchef stack
  become: true
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans
    chdir: "{{ cyberchef_dir }}"
  changed_when: false
