---
- name: Install docker and the compose plugin
  become: true
  tags:
    - pkg
    - docker
  community.general.apk:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true

- name: Enable and start docker
  become: true
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started

- name: Allow users to use the docker socket
  become: true
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"

- name: Check the compose plugin
  become: true
  ansible.builtin.command:
    cmd: docker compose version
  changed_when: false
