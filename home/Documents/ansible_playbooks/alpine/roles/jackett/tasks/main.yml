---
- name: Create the jackett stack directory
  become: true
  ansible.builtin.file:
    path: "{{ jackett_dir }}"
    state: directory
    mode: '0700'

- name: Create the jackett config directory
  become: true
  ansible.builtin.file:
    path: "{{ jackett_config_dir }}"
    state: directory
    owner: "{{ jackett_uid }}"
    group: "{{ jackett_gid }}"
    mode: '0700'

- name: Create the jackett blackhole directory
  become: true
  ansible.builtin.file:
    path: "{{ jackett_downloads_dir }}"
    state: directory
    owner: "{{ jackett_uid }}"
    group: "{{ jackett_gid }}"
    mode: '0755'

- name: Deploy the jackett compose file
  become: true
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ jackett_dir }}/docker-compose.yml"
    mode: '0600'

# No community.docker dependency on purpose: the CLI is idempotent here.
- name: Start the jackett stack
  become: true
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans
    chdir: "{{ jackett_dir }}"
  changed_when: false
