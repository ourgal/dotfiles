---
mihomo_version: "1.19.33"
mihomo_install_dir: /usr/local/bin
mihomo_binary: "{{ mihomo_install_dir }}/mihomo"
mihomo_config_dir: /etc/mihomo

mihomo_arch_map:
  x86_64: amd64-compatible
  aarch64: arm64
  armv7l: armv7
  armv6l: armv6
mihomo_arch: "{{ mihomo_arch_map[ansible_facts.architecture] }}"
mihomo_archive: "/tmp/mihomo-linux-{{ mihomo_arch }}-v{{ mihomo_version }}.gz"
mihomo_unpacked: "/tmp/mihomo-linux-{{ mihomo_arch }}-v{{ mihomo_version }}"
mihomo_download_url: "https://github.com/MetaCubeX/mihomo/releases/download/v{{ mihomo_version }}/mihomo-linux-{{ mihomo_arch }}-v{{ mihomo_version }}.gz"

mihomo_packages:
  - ca-certificates
  - gzip
  - iptables
  - nftables
