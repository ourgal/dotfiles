tailscale_enabled: true
rsshub_enabled: true
miniflux_enabled: false
# Needs freshrss_admin_password + freshrss_db_password in secrets.sops.yml first.
freshrss_enabled: false
mihomo_enabled: true
gitea_enabled: true
# Without soft_serve_initial_admin_keys the server boots with no admin.
soft_serve_enabled: false
dufs_enabled: false
nextcloud_enabled: true
liseur_sync_enabled: true
# Pinned: mihomo's TUN owns the default route, so default_ipv4 resolves to
# 198.18.0.1 and Nextcloud would reject http://192.168.0.101:8080.
nextcloud_domain: 192.168.0.101
docker_enabled: true

# Needs hindsight_llm_api_key + hindsight_db_password in secrets.sops.yml first.
hindsight_enabled: false

qiandao_enabled: false

# Point jellyfin_media_dirs at the library; jellyfin_uid/gid must be able to
# read it (default 1000:1000).
jellyfin_enabled: false

# Point kavita_library_dirs at the manga/comic/book folders.
kavita_enabled: false

# Needs ariang_rpc_secret in secrets.sops.yml, or set it here for LAN-only use.
ariang_enabled: false

# Keep sonarr_downloads_dir on the same host tree as the download client.
sonarr_enabled: false

# Point sonarr's indexers at http://<host>:9117 once Jackett is running.
jackett_enabled: false

# Enable changedetection_browser_enabled for pages that need JavaScript.
changedetection_enabled: false

# The first user registered in the web UI becomes the administrator.
cloudreve_enabled: false

# Stateless static web app; port 8000 avoids nextcloud's 8080.
cyberchef_enabled: false

# The first account created in the web UI becomes the administrator.
memos_enabled: false

# Set pairdrop_ws_fallback: true when clients connect through a VPN that
# blocks WebRTC; traffic is then relayed by the server.
pairdrop_enabled: false

# Needs siyuan_access_auth_code in secrets.sops.yml; without a lock-screen
# password the instance is reachable unauthenticated.
siyuan_enabled: false

# transmission_downloads_dir must match sonarr's tree so imports rename instead
# of copy; set transmission_rpc_user/password in secrets.sops.yml.
transmission_enabled: false

# The first account created in the web UI becomes the administrator; monitors
# and history are stored under /srv/uptime-kuma/data.
uptime_kuma_enabled: false

# Register the first account while signups are open, then set
# vaultwarden_signups_allowed: false; vaultwarden_admin_token belongs in
# secrets.sops.yml and vaultwarden_domain should be the HTTPS reverse-proxy URL.
vaultwarden_enabled: false

# Set code_server_hashed_password (or code_server_password) in secrets.sops.yml;
# without one code-server generates a random password visible in its logs.
code_server_enabled: false

# Set wallabag_domain to the external URL (e.g. http://192.168.0.101:8083) or
# assets and clients break; the initial admin is wallabag/wallabag.
wallabag_enabled: false

# Point uchiyomi_library_dir at your comics and set uchiyomi_public_origin to
# the address clients use; PUID/PGID must own the library for downloads to work.
uchiyomi_enabled: false

# Set whoogle_user/password in secrets.sops.yml to require HTTP basic auth;
# whoogle_config_url should be the URL used when adding it as a search engine.
whoogle_enabled: false

# Updates every running container daily via the Docker socket, which is
# root-equivalent host access.
watchtower_enabled: false

# Stateless WiFi QR-code generator; nothing is stored server-side.
wifi_card_enabled: false

# Point lanraragi_content_dir at your comic archives; the initial admin
# password is shown on the login screen.
lanraragi_enabled: false

# Point navidrome_music_dir at your music library (mounted read-only); the
# first account created in the web UI becomes the administrator.
navidrome_enabled: false

# netdata_docker_gid must match the host's docker group (getent group docker);
# the agent also needs SYS_PTRACE, host /proc, /sys and the Docker socket.
netdata_enabled: false

# Point lidarr_music_dir at your library and keep lidarr_downloads_dir on the
# same tree as transmission so imports rename instead of copy.
lidarr_enabled: false

# The first visit runs a setup wizard where you sign in to Jellyfin and add
# your Radarr/Sonarr servers; list their URLs reachable from this container.
jellyseerr_enabled: false

