---
- name: Configure Alpine Linux
  hosts: all
  ignore_unreachable: true
  roles:
    - role: network
      when: network_enabled | default(false) | bool
    - role: docker
      when: docker_enabled | default(false) | bool
    - role: gitea
      when: gitea_enabled | default(false) | bool
    - role: tailscale
      when: tailscale_enabled | default(false) | bool
    - role: mihomo
      when: mihomo_enabled | default(false) | bool
    - role: honk
      when: honk_enabled | default(false) | bool
    - role: rsshub
      when: rsshub_enabled | default(false) | bool
  post_tasks:
    - name: Check whether the proxy services are installed
      ansible.builtin.stat:
        path: "/etc/init.d/{{ item }}"
      loop:
        - tailscale
        - mihomo
        - honk
      register: proxy_services

    - name: Stop and disable proxy services whose switch is off
      become: true
      ansible.builtin.service:
        name: "{{ item.item }}"
        enabled: false
        state: stopped
      loop: "{{ proxy_services.results }}"
      loop_control:
        label: "{{ item.item }}"
      when:
        - item.stat.exists
        - not (lookup('vars', item.item ~ '_enabled', default=false) | bool)
