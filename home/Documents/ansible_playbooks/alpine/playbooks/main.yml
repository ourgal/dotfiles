---
- name: Configure Alpine Linux
  hosts: all
  ignore_unreachable: true
  pre_tasks:
    # Explicit decrypt; the community.sops vars plugin is enabled but an
    # unloadable plugin would otherwise silently leave the secrets undefined.
    - name: Load encrypted credentials
      community.sops.load_vars:
        file: "{{ inventory_dir }}/group_vars/secrets.sops.yml"
  roles:
    - role: network
      when: network_enabled | default(false) | bool
    - role: docker
      when: docker_enabled | default(false) | bool
    - role: gitea
      when: gitea_enabled | default(false) | bool
    - role: soft_serve
      when: soft_serve_enabled | default(false) | bool
    - role: dufs
      when: dufs_enabled | default(false) | bool
    - role: tailscale
      when: tailscale_enabled | default(false) | bool
    - role: mihomo
      when: mihomo_enabled | default(false) | bool
    - role: honk
      when: honk_enabled | default(false) | bool
    - role: rsshub
      when: rsshub_enabled | default(false) | bool
    - role: miniflux
      when: miniflux_enabled | default(false) | bool
    - role: freshrss
      when: freshrss_enabled | default(false) | bool
    - role: nextcloud
      when: nextcloud_enabled | default(false) | bool
    - role: liseur_sync
      when: liseur_sync_enabled | default(false) | bool
    - role: kavita
      when: kavita_enabled | default(false) | bool
    - role: jellyfin
      when: jellyfin_enabled | default(false) | bool
    - role: ariang
      when: ariang_enabled | default(false) | bool
    - role: sonarr
      when: sonarr_enabled | default(false) | bool
    - role: jackett
      when: jackett_enabled | default(false) | bool
    - role: changedetection
      when: changedetection_enabled | default(false) | bool
    - role: cloudreve
      when: cloudreve_enabled | default(false) | bool
    - role: cyberchef
      when: cyberchef_enabled | default(false) | bool
    - role: qiandao
      when: qiandao_enabled | default(false) | bool
    - role: memos
      when: memos_enabled | default(false) | bool
    - role: pairdrop
      when: pairdrop_enabled | default(false) | bool
    - role: siyuan
      when: siyuan_enabled | default(false) | bool
    - role: hindsight
      when: hindsight_enabled | default(false) | bool
  post_tasks:
    - name: Check whether the proxy services are installed
      ansible.builtin.stat:
        path: "/etc/init.d/{{ item }}"
      loop:
        - tailscale
        - mihomo
        - honk
      register: proxy_services

    - name: Stop and disable proxy services whose switch is off
      become: true
      ansible.builtin.service:
        name: "{{ item.item }}"
        enabled: false
        state: stopped
      loop: "{{ proxy_services.results }}"
      loop_control:
        label: "{{ item.item }}"
      when:
        - item.stat.exists
        - not (lookup('vars', item.item ~ '_enabled', default=false) | bool)
