---
- name: Configure macos
  hosts: all
  roles:
    - role: homebrew
    - role: pipx
    # Both AI roles are listed unconditionally: disabling one must still run its
    # retire path instead of skipping it. Order matters — mlx_vlm frees port
    # 8080 before llama_cpp binds it.
    - role: mlx_vlm
    - role: llama_cpp
