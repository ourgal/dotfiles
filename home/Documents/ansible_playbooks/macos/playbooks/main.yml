---
- name: Configure macos
  hosts: all
  roles:
    # Run first: the removal reboots into a Mac that no longer offers NixOS.
    - role: nixos_uninstall
      when: nixos_uninstall_enabled | bool
      tags:
        - nix
        - uninstall
    # Before homebrew: its geerlingguy role calls git, which needs the CLT.
    - role: xcode_clt
    - role: homebrew
    # Needs npm from the Homebrew `node` formula above.
    - role: npm
    - role: pipx
    # Hermes Agent + Mnemosyne memory plugin; both installed into the user's
    # own home by the official unattended installer.
    - role: hermes_agent
      when: hermes_agent_enabled | bool
    # fcitx5-macos (Rime edition) + 声笔飞码 (sbfm), same rime user directory as Linux.
    - role: fcitx5
      when: fcitx5_enabled | bool
    # Both AI roles are listed unconditionally: disabling one must still run its
    # retire path instead of skipping it. Order matters — mlx_vlm frees port
    # 8080 before llama_cpp binds it.
    - role: mlx_vlm
    - role: llama_cpp
