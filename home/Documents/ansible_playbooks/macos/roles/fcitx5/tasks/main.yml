---
# The app itself is the source of truth for "already installed": it exists
# after install.sh runs, and also after a manual install. Skip the installer
# download/unpack when present, but keep the config tasks below so the Rime
# schemes still deploy into an existing installation. Removing
# {{ fcitx5_app }} forces a full reinstall.
- name: Check whether Fcitx5 is already installed
  ansible.builtin.stat:
    path: "{{ fcitx5_app }}"
  register: fcitx5_installed
  tags:
    - fcitx5

# Shared by the installer and the scheme downloads below, so keep it
# unconditional even when Fcitx5 is already installed.
- name: Create the installer staging directory
  tags:
    - install
    - fcitx5
  ansible.builtin.file:
    path: "{{ fcitx5_stage }}"
    state: directory
    mode: "0700"

- name: Download the Fcitx5 (Rime edition) installer
  when: not fcitx5_installed.stat.exists
  tags:
    - install
    - fcitx5
  ansible.builtin.get_url:
    url: "{{ fcitx5_installer_url }}"
    dest: "{{ fcitx5_stage }}/Fcitx5-Rime.zip"
    mode: "0644"

- name: Unpack the installer
  when: not fcitx5_installed.stat.exists
  tags:
    - install
    - fcitx5
  ansible.builtin.unarchive:
    src: "{{ fcitx5_stage }}/Fcitx5-Rime.zip"
    dest: "{{ fcitx5_stage }}"
    remote_src: true

# Created as the user first so root's mkdir -p cannot own them.
- name: Create the fcitx5 user directories
  tags:
    - config
    - fcitx5
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - "{{ fcitx5_home }}/.config"
    - "{{ fcitx5_config_dir }}"
    - "{{ fcitx5_library_dir }}"
    - "{{ fcitx5_data_dir }}"

# install.sh <user> <Resources> unpacks Fcitx5.app into /Library/Input Methods
# (root required), drops the rime plugin into ~/Library/fcitx5, then registers
# and enables the input method. `creates` keeps it out of later runs; remove
# {{ fcitx5_app }} to force a reinstall.
- name: Install Fcitx5.app and the rime plugin
  when: not fcitx5_installed.stat.exists
  become: true
  tags:
    - install
    - fcitx5
  ansible.builtin.command:
    cmd: "{{ fcitx5_stage }}/Fcitx5Installer.app/Contents/Resources/install.sh {{ fcitx5_user }} {{ fcitx5_stage }}/Fcitx5Installer.app/Contents/Resources"
    creates: "{{ fcitx5_app }}"

# Root still writes files inside the tree, so restore ownership afterwards.
- name: Hand the fcitx5 user directories back to the user
  become: true
  tags:
    - config
    - fcitx5
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ fcitx5_user }}"
    group: "{{ fcitx5_group }}"
    recurse: true
  loop:
    - "{{ fcitx5_config_dir }}"
    - "{{ fcitx5_library_dir }}"
    - "{{ fcitx5_data_dir }}"

# Non-recursive: the entries below `.config` belong to the user already.
- name: Hand ~/.config back to the user
  become: true
  tags:
    - config
    - fcitx5
  ansible.builtin.file:
    path: "{{ fcitx5_home }}/.config"
    state: directory
    owner: "{{ fcitx5_user }}"
    group: "{{ fcitx5_group }}"

- name: Create the Rime user directory
  tags:
    - config
    - fcitx5
  ansible.builtin.file:
    path: "{{ fcitx5_rime_dir }}"
    state: directory
    mode: "0700"

- name: Download the sbsrf (声笔) Rime schemes
  tags:
    - config
    - fcitx5
  ansible.builtin.get_url:
    url: "{{ fcitx5_scheme_url }}"
    dest: "{{ fcitx5_stage }}/sbsrf.zip"
    mode: "0644"

# *.custom.yaml belongs to chezmoi (default.custom.yaml pins schema_list to
# sbfm, mirroring the Windows Weasel wiring); the upstream multi-schema copy
# must not overwrite it. `unarchive` appends extra_opts BEFORE the archive path,
# which unzip rejects (`cannot find or open *.custom.yaml`), so the argument
# order is spelled out here. `creates` keeps this idempotent — delete
# sbfm.schema.yaml to force a scheme refresh.
- name: Deploy the sbsrf schemes into the Rime user directory
  tags:
    - config
    - fcitx5
  ansible.builtin.command:
    argv:
      - /usr/bin/unzip
      - -o
      - "{{ fcitx5_stage }}/sbsrf.zip"
      - -d
      - "{{ fcitx5_rime_dir }}"
      - -x
      - "*.custom.yaml"
    creates: "{{ fcitx5_rime_dir }}/sbfm.schema.yaml"
