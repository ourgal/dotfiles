---
# An old Homebrew checkout still on `master` makes every brew command fail with
# "Homebrew's master branch is no longer supported", including the `brew --cache`
# that the geerlingguy role runs before it gets to its own update task.
# `brew update` performs the migration to `main`.
- name: Migrate the Homebrew checkout off the master branch
  when: homebrew_migrate_enabled | bool
  tags:
    - homebrew
    - install
  block:
    - name: Check whether Homebrew is already installed
      ansible.builtin.stat:
        path: "{{ homebrew_migrate_prefix }}/bin/brew"
      register: homebrew_migrate_installed

    - name: Read the Homebrew checkout branch
      when: homebrew_migrate_installed.stat.exists
      ansible.builtin.command:
        argv: [git, -C, "{{ homebrew_migrate_prefix }}", rev-parse, --abbrev-ref, HEAD]
      register: homebrew_migrate_branch
      changed_when: false

    - name: Migrate Homebrew to the main branch
      when:
        - homebrew_migrate_installed.stat.exists
        - homebrew_migrate_branch.stdout | trim == 'master'
      ansible.builtin.command:
        argv: ["{{ homebrew_migrate_prefix }}/bin/brew", update]
      changed_when: true

- name: Run geerlingguy.mac.homebrew
  ansible.builtin.import_role:
    name: geerlingguy.mac.homebrew
  vars:
    homebrew_installed_packages: "{{ homebrew_packages.values() | list | flatten }}"
    homebrew_cask_apps: "{{ homebrew_casks.values() | list | flatten }}"

# Homebrew's installer only prints the `brew shellenv` hint, and this repo
# manages no zsh/bash init on macOS, so a login shell never sees
# /opt/homebrew/bin and every brew-installed command is "not found".
# path_helper (run from /etc/zprofile) folds /etc/paths.d into PATH for zsh and
# bash alike, so one root-owned file fixes every shell without touching rcs.
- name: Put Homebrew on PATH for every login shell
  become: true
  tags:
    - config
    - homebrew
  ansible.builtin.copy:
    dest: /etc/paths.d/homebrew
    mode: "0644"
    content: |
      {{ homebrew_prefix }}/bin
      {{ homebrew_prefix }}/sbin
