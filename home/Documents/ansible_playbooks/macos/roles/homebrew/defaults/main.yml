---
homebrew_migrate_enabled: true
homebrew_prefix: /opt/homebrew
homebrew_migrate_prefix: "{{ homebrew_prefix }}"

homebrew_packages:
  git:
    - git
    - lazygit
    - gh
  dotfiles:
    - chezmoi
    - gopass
  editor:
    - helix
    - vim
  shell:
    - fish
    - tmux
    - fzf
    - zoxide
    - starship
    - btop
    - duf
  python:
    - python
    - pipx
    - ansible
  nodejs:
    - node
  media:
    - mpv
  network:
    - wget
    - syncthing
    - dufs

homebrew_casks:
  browser:
    - ungoogled-chromium
  terminal:
    - kitty
  reader:
    - readest
