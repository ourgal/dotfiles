---
homebrew_migrate_enabled: true
homebrew_migrate_prefix: /opt/homebrew

homebrew_packages:
  git:
    - git
    - lazygit
    - gh
  dotfiles:
    - chezmoi
    - gopass
  editor:
    - helix
    - vim
  shell:
    - fish
    - fzf
    - btop
    - duf
  python:
    - python
    - pipx
  media:
    - mpv
  network:
    - wget
    - syncthing
    - dufs

homebrew_casks:
  browser:
    - ungoogled-chromium
  terminal:
    - kitty
  reader:
    - readest
