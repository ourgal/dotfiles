---
- name: Create the MLX directories
  tags:
    - config
    - mlx_vlm
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ mlx_vlm_prefix }}"
    - "{{ mlx_vlm_prefix }}/models"
    - "{{ mlx_vlm_cache_dir }}"
    - "{{ mlx_vlm_log_dir }}"
    - "{{ mlx_vlm_home }}/.local/bin"

- name: Install uv
  tags:
    - pkg
    - mlx_vlm
  community.general.homebrew:
    name: uv
    state: present

- name: Install the MLX server stack
  tags:
    - pkg
    - mlx_vlm
  ansible.builtin.shell:
    cmd: >-
      /opt/homebrew/bin/uv venv {{ mlx_vlm_venv }} --python {{ mlx_vlm_python_version }} &&
      /opt/homebrew/bin/uv pip install --python {{ mlx_vlm_venv }}/bin/python
      {{ mlx_vlm_packages | join(' ') }}
    # Versioned marker: bumping mlx or mlx-lm rebuilds the venv.
    creates: "{{ mlx_vlm_venv }}/.stack-{{ mlx_vlm_mlx_version }}-{{ mlx_vlm_mlx_lm_version }}"
    chdir: "{{ mlx_vlm_prefix }}"
    executable: /bin/sh

- name: Check whether the Bonsai MLX model is present
  tags:
    - pkg
    - config
    - mlx_vlm
  ansible.builtin.stat:
    path: "{{ mlx_vlm_model_dir }}/model.safetensors"
  register: mlx_vlm_model

- name: Download the Bonsai MLX model
  when: not mlx_vlm_model.stat.exists
  tags:
    - pkg
    - config
    - mlx_vlm
  ansible.builtin.command:
    cmd: >-
      {{ mlx_vlm_venv }}/bin/hf download {{ mlx_vlm_model_repo }}
      --local-dir {{ mlx_vlm_model_dir }}
  environment:
    HOME: "{{ mlx_vlm_home }}"
    HF_HOME: "{{ mlx_vlm_cache_dir }}"

- name: Require the Bonsai MLX model to be present
  tags:
    - pkg
    - config
    - mlx_vlm
  ansible.builtin.stat:
    path: "{{ mlx_vlm_model_dir }}/model.safetensors"
  register: mlx_vlm_model_after

- name: Assert the Bonsai MLX model was downloaded
  tags:
    - pkg
    - config
    - mlx_vlm
  ansible.builtin.assert:
    that: mlx_vlm_model_after.stat.exists
    fail_msg: >-
      {{ mlx_vlm_model_dir }}/model.safetensors is missing. Check `hf download`
      output and that {{ mlx_vlm_model_repo }} is reachable.

- name: Install the bonsai-mlx-server wrapper
  tags:
    - config
    - mlx_vlm
  ansible.builtin.template:
    src: bonsai-mlx-server.sh.j2
    dest: "{{ mlx_vlm_wrapper }}"
    mode: "0755"
  notify: Restart mlx-vlm

- name: Install the launchd daemon definition
  become: true
  tags:
    - config
    - mlx_vlm
  ansible.builtin.template:
    src: mlx-server.plist.j2
    dest: "{{ mlx_vlm_plist }}"
    owner: root
    group: wheel
    mode: "0644"
  notify: Restart mlx-vlm

- name: Enable and start the MLX server
  become: true
  tags:
    - service
    - mlx_vlm
  community.general.launchd:
    name: "{{ mlx_vlm_service }}"
    state: started
    enabled: true

- name: Wait for the OpenAI-compatible API
  tags:
    - service
    - mlx_vlm
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ mlx_vlm_port }}/v1/models"
    method: GET
    status_code: 200
  register: mlx_vlm_health
  until: mlx_vlm_health.status == 200
  retries: 60
  delay: 5
  changed_when: false
