---
# The role is listed unconditionally in playbooks/main.yml: disabling it must
# still stop the daemon and remove the model, or port 8080 stays occupied and
# its weights keep holding RAM.
- name: Serve the MLX model
  when: mlx_vlm_enabled | bool
  ansible.builtin.import_tasks: serve.yml

- name: Retire the MLX model
  when: not (mlx_vlm_enabled | bool)
  ansible.builtin.import_tasks: retire.yml
