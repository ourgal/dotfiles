---
# Apple Silicon MLX server for 1-bit Bonsai 27B, replacing the llama.cpp role.
# 1-bit affine quantization landed upstream in mlx#3161 (Oct 2026, first
# release 0.32.4), so the prebuilt wheel loads the pack — no fork, no Xcode.
# The pack is text-only on MLX (upstream VISION.md); images stay on llama.cpp.
mlx_vlm_enabled: true

mlx_vlm_model_repo: prism-ml/Bonsai-27B-mlx-1bit
mlx_vlm_model_name: Bonsai-27B-mlx-1bit

# mlx/mlx-lm pair from the Bonsai-demo mlx-vlm requirements. mlx 0.32.4 is the
# first wheel with bits=1 kernels; 0.32.5 is current. Python 3.11 is the version
# the 27B pack was validated with.
mlx_vlm_python_version: "3.11"
mlx_vlm_mlx_version: "0.32.5"
mlx_vlm_mlx_lm_version: "0.32.0"
mlx_vlm_packages:
  - "mlx=={{ mlx_vlm_mlx_version }}"
  - "mlx-lm=={{ mlx_vlm_mlx_lm_version }}"
  - "transformers==5.19.0"
  - "huggingface-hub[cli]>=1.0"

# Model-card sampling for thinking mode (the 27B reasons before it answers).
mlx_vlm_temp: 0.7
mlx_vlm_top_p: 0.95
mlx_vlm_top_k: 20
mlx_vlm_min_p: 0.0
mlx_vlm_max_tokens: 16384
# mlx_lm.server keeps a LRU prompt cache in RAM; 16 GiB mini needs a ceiling.
mlx_vlm_prompt_cache_bytes: 2G

# mlx_lm.server has no auth (llama-server's --api-key has no equivalent).
# Bound to the whole LAN: restrict with firewall/reverse proxy if untrusted.
mlx_vlm_host: 0.0.0.0
mlx_vlm_port: 8080

mlx_vlm_user: "{{ ansible_user_id }}"
mlx_vlm_group: staff
mlx_vlm_home: "{{ ansible_env.HOME }}"
mlx_vlm_prefix: "{{ mlx_vlm_home }}/.local/share/mlx-vlm"
mlx_vlm_model_dir: "{{ mlx_vlm_prefix }}/models/{{ mlx_vlm_model_name }}"
mlx_vlm_venv: "{{ mlx_vlm_prefix }}/venv"
mlx_vlm_cache_dir: "{{ mlx_vlm_prefix }}/cache"
mlx_vlm_log_dir: "{{ mlx_vlm_prefix }}/logs"
mlx_vlm_wrapper: "{{ mlx_vlm_home }}/.local/bin/bonsai-mlx-server"

mlx_vlm_service: local.prismml.mlx-server
mlx_vlm_plist: "/Library/LaunchDaemons/{{ mlx_vlm_service }}.plist"
