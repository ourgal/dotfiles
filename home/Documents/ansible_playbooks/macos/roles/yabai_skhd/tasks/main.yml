---
# User-owned Homebrew prefix and user LaunchAgents, so no become is needed
# (same as the other user-level macOS roles).
- name: Add the asmvik formulae tap
  tags:
    - pkg
    - yabai
    - skhd
  community.general.homebrew_tap:
    name: "{{ yabai_skhd_tap }}"
    state: present
    # Newer Homebrew refuses to load formulae from untrusted third-party taps.
    trust: true
    path: "{{ yabai_skhd_prefix }}/bin"

- name: Install yabai and skhd
  tags:
    - pkg
    - yabai
    - skhd
    - install
  community.general.homebrew:
    name: "{{ yabai_skhd_packages }}"
    state: present
    path: "{{ yabai_skhd_prefix }}/bin"

# --start-service writes the LaunchAgent plist when missing, then loads it.
# The plist is the source of truth: re-running an already loaded service is a
# no-op, and a missing plist means it was never installed (or was uninstalled).
- name: Check the yabai login service
  tags:
    - config
    - yabai
  ansible.builtin.stat:
    path: "{{ yabai_skhd_yabai_plist }}"
  register: yabai_skhd_yabai_service

- name: Start the yabai login service
  when: not yabai_skhd_yabai_service.stat.exists
  tags:
    - config
    - yabai
  ansible.builtin.command:
    argv:
      - "{{ yabai_skhd_prefix }}/bin/yabai"
      - --start-service
  changed_when: true

- name: Check the skhd login service
  tags:
    - config
    - skhd
  ansible.builtin.stat:
    path: "{{ yabai_skhd_skhd_plist }}"
  register: yabai_skhd_skhd_service

- name: Start the skhd login service
  when: not yabai_skhd_skhd_service.stat.exists
  tags:
    - config
    - skhd
  ansible.builtin.command:
    argv:
      - "{{ yabai_skhd_prefix }}/bin/skhd"
      - --start-service
  changed_when: true
