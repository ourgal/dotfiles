---
- name: Install global npm packages
  tags:
    - pkg
    - npm
  environment:
    npm_config_registry: "{{ npm_registry }}"
    # /etc/paths.d/homebrew only applies to login shells; Ansible's remote
    # shell is non-login, so `env node` in npm's shebang cannot find node.
    PATH: "{{ npm_homebrew_prefix }}/bin:{{ ansible_env.PATH }}"
  community.general.npm:
    name: "{{ item }}"
    global: true
    state: latest
    executable: "{{ npm_executable }}"
  loop: "{{ npm_packages }}"
