---
# Node/npm come from Homebrew's `node` formula, installed into the user-owned
# /opt/homebrew prefix, so global installs need neither become nor PATH fixes.
npm_executable: /opt/homebrew/bin/npm
npm_registry: https://registry.npmmirror.com
# CodeBuddy needs Node >= 18.20, dsh >= 24.9; Homebrew ships current Node.
npm_packages:
  - "@tencent-ai/codebuddy-code"
  - "@deepseek-ai/dsh"
