---
hermes_agent_enabled: true
# Installed for this user, never system-wide: the official installer puts the
# checkout, uv tool store and ~/.local/bin launcher inside the user's own home.
hermes_agent_user_home: "{{ ansible_facts.user_dir }}"
hermes_agent_home: "{{ hermes_agent_user_home }}/.hermes"
hermes_agent_launcher: "{{ hermes_agent_user_home }}/.local/bin/hermes"
hermes_agent_installer_url: https://hermes-agent.nousresearch.com/install.sh
# stable: latest published release (what `hermes update` then follows).
hermes_agent_channel: stable
# Homebrew already installs ungoogled-chromium, so the pinned browser download
# is redundant. Undo on the host with `hermes pm install chromium`.
hermes_agent_skip_browser: true
# Installer prerequisites are git, curl, tar and sha256sum/shasum: curl, tar and
# shasum ship with macOS, and the xcode_clt role provides git, so no extra
# packages are installed here. uv is staged by the installer itself.
# Applied with `hermes config set <key> <value>` after install — config.yaml is
# never hand-edited. Example: {llm.provider: openrouter, llm.model: "..."}
hermes_agent_config: {}
# Written to ~/.hermes/.env (0600). Secrets belong in
# inventory/group_vars/secrets.sops.yml, never in this file.
hermes_agent_env: {}
# Hermes >= 0.21.4 ships a curated plugin catalog; newer releases dropped the
# old `hermes-agent/venv` in favour of a uv-managed tool store. Mnemosyne is a
# catalog memory plugin, so install it by name and let Hermes resolve/pin its
# own Python dependencies (and re-apply them after `hermes update`).
hermes_agent_mnemosyne_enabled: true
hermes_agent_mnemosyne_plugin: mnemosyne
