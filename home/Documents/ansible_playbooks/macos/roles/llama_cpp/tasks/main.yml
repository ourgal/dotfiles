---
# The role is listed unconditionally in playbooks/main.yml: disabling it must
# still run the retire path, or the daemon keeps the deleted GGUF mapped and
# the RAM it holds is unavailable to the replacement server.
- name: Install and start llama.cpp
  when: llama_cpp_enabled | bool
  ansible.builtin.import_tasks: serve.yml

- name: Retire llama.cpp
  when: not (llama_cpp_enabled | bool)
  ansible.builtin.import_tasks: retire.yml
