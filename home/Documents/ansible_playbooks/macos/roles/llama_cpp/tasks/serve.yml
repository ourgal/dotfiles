---
- name: Create the llama.cpp directories
  tags:
    - config
    - llama_cpp
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ llama_cpp_prefix }}"
    - "{{ llama_cpp_model_dir }}"
    - "{{ llama_cpp_cache_dir }}"
    - "{{ llama_cpp_log_dir }}"
    - "{{ llama_cpp_home }}/.local/bin"

- name: Install llama.cpp
  tags:
    - pkg
    - llama_cpp
  community.general.homebrew:
    name: llama.cpp
    state: present

- name: Create the Hugging Face CLI virtualenv
  tags:
    - pkg
    - llama_cpp
  ansible.builtin.command:
    cmd: "{{ llama_cpp_python }} -m venv {{ llama_cpp_venv }}"
    creates: "{{ llama_cpp_venv }}/bin/python"
  changed_when: true

- name: Install the Hugging Face CLI
  tags:
    - pkg
    - llama_cpp
  ansible.builtin.pip:
    name: huggingface-hub
    virtualenv: "{{ llama_cpp_venv }}"
    state: present

- name: Check the llama.cpp build
  tags:
    - pkg
    - llama_cpp
  ansible.builtin.command:
    cmd: "{{ llama_cpp_cli_binary }} --version"
  register: llama_cpp_version
  changed_when: false

- name: Record the llama.cpp build number
  tags:
    - pkg
    - llama_cpp
  ansible.builtin.set_fact:
    # Newer llama.cpp releases may print a semver instead of bNNNNN; in that
    # case the check below is skipped and the API health check is authoritative.
    llama_cpp_build_number: >-
      {{ llama_cpp_version.stdout | regex_findall('b([0-9]{4,7})') | first | default('') }}

- name: Require a build with bailingmoe3 support
  when: llama_cpp_build_number | length > 0
  tags:
    - pkg
    - llama_cpp
  ansible.builtin.assert:
    that: llama_cpp_build_number | int >= (llama_cpp_min_version[1:] | int)
    fail_msg: >-
      llama.cpp {{ llama_cpp_build_number }} is older than {{ llama_cpp_min_version }}.
      Ling 3.0 Tiny's bailingmoe3 architecture is unsupported on older builds and
      the GGUF can load as garbage. Run `brew upgrade llama.cpp`.

- name: Check whether the Ling GGUF model is present
  tags:
    - pkg
    - config
    - llama_cpp
  ansible.builtin.stat:
    path: "{{ llama_cpp_model_path }}"
  register: llama_cpp_model

- name: Download the Ling GGUF model
  when: not llama_cpp_model.stat.exists
  tags:
    - pkg
    - config
    - llama_cpp
  ansible.builtin.command:
    cmd: >-
      {{ llama_cpp_venv }}/bin/hf download {{ llama_cpp_model_repo }}
      {{ llama_cpp_model_file }} --local-dir {{ llama_cpp_model_dir }}
  environment:
    HOME: "{{ llama_cpp_home }}"
    HF_HOME: "{{ llama_cpp_cache_dir }}"

- name: Require the Ling GGUF model to be present
  tags:
    - pkg
    - config
    - llama_cpp
  ansible.builtin.stat:
    path: "{{ llama_cpp_model_path }}"
  register: llama_cpp_model_after

- name: Assert the Ling GGUF model was downloaded
  tags:
    - pkg
    - config
    - llama_cpp
  ansible.builtin.assert:
    that: llama_cpp_model_after.stat.exists
    fail_msg: >-
      {{ llama_cpp_model_path }} is missing. Check `hf download` output and
      that {{ llama_cpp_model_repo }} is reachable.

- name: Remove retired GGUF models
  tags:
    - config
    - llama_cpp
  ansible.builtin.file:
    path: "{{ llama_cpp_model_dir }}/{{ item }}"
    state: absent
  loop: "{{ llama_cpp_retired_models }}"

- name: Remove the retired bonsai-server wrapper
  tags:
    - config
    - llama_cpp
  ansible.builtin.file:
    path: "{{ llama_cpp_home }}/.local/bin/bonsai-server"
    state: absent

- name: Install the ling-server wrapper
  tags:
    - config
    - llama_cpp
  ansible.builtin.template:
    src: ling-server.sh.j2
    dest: "{{ llama_cpp_wrapper }}"
    # 0700: the wrapper embeds the API key when one is configured.
    mode: "0700"
  notify: Restart llama.cpp

- name: Install the launchd daemon definition
  become: true
  tags:
    - config
    - llama_cpp
  ansible.builtin.template:
    src: llama-server.plist.j2
    dest: "{{ llama_cpp_plist }}"
    owner: root
    group: wheel
    mode: "0644"
  notify: Restart llama.cpp

- name: Enable and start llama.cpp
  become: true
  tags:
    - service
    - llama_cpp
  community.general.launchd:
    name: "{{ llama_cpp_service }}"
    state: started
    enabled: true

- name: Wait for the OpenAI-compatible API
  tags:
    - service
    - llama_cpp
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ llama_cpp_port }}/v1/models"
    method: GET
    headers: "{{ {'Authorization': 'Bearer ' ~ llama_cpp_api_key} if llama_cpp_api_key else {} }}"
    status_code: 200
  register: llama_cpp_health
  until: llama_cpp_health.status == 200
  retries: 60
  delay: 5
  changed_when: false

- name: Assert the configured model is the one being served
  tags:
    - service
    - llama_cpp
  ansible.builtin.assert:
    that:
      - "llama_cpp_model_alias in (llama_cpp_health.json.data | default([]) | map(attribute='id') | list)"
    fail_msg: >-
      Port {{ llama_cpp_port }} is not serving the {{ llama_cpp_model_alias }} alias.
      Another server (e.g. mlx_vlm) may still own the port.
