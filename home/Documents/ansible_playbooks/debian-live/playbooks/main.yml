---
# Run from a Debian live ISO session:
# - enable ssh + password login on the live system, ssh-copy-id from the control machine
# - the live target disk is chosen automatically: biggest non-removable disk
# - layout: GPT with ESP (vfat, required for UEFI) + one btrfs partition covering
#   the rest of the disk, @ and @home subvolumes, compress=zstd everywhere
- name: Install debian
  hosts: all
  vars:
    mirror: https://mirror.nju.edu.cn/debian
    suite: trixie
    hostname: surface
    timezone: Asia/Shanghai
    user: zxc
    target: /mnt
    btrfs_opts: rw,noatime,compress=zstd:3,ssd,discard=async,space_cache=v2
    base_packages:
      - linux-image-amd64
      - grub-efi-amd64
      - grub-efi-amd64-signed
      - shim-signed
      - sudo
      - openssh-server
      - network-manager
      - chrony
      - btrfs-progs
    extra_packages:
      - python3
  tasks:
    - name: Debug variables
      tags:
        - debug
      ansible.builtin.debug:
        var: ansible_facts
    - name: Set apt mirror on live system
      become: true
      tags:
        - setup
      ansible.builtin.copy:
        dest: /etc/apt/sources.list
        mode: "0644"
        content: |
          deb {{ mirror }} {{ ansible_distribution_release }} main contrib non-free non-free-firmware
          deb {{ mirror }} {{ ansible_distribution_release }}-updates main contrib non-free non-free-firmware
          deb {{ mirror }} {{ ansible_distribution_release }}-backports main contrib non-free non-free-firmware
    - name: Install live prerequisites
      become: true
      tags:
        - setup
      ansible.builtin.apt:
        update_cache: true
        pkg:
          - debootstrap
          - btrfs-progs
          - dosfstools
          - mtools
          - parted
          - gdisk
    - name: Pick the biggest non-removable disk
      tags:
        - disk
      ansible.builtin.set_fact:
        device: "/dev/{{ (disks | sort(attribute='bytes', reverse=True) | first).name }}"
      when: disks | length > 0
      vars:
        disks: >-
          {%- set ns = namespace(devs=[]) -%}
          {%- for d in ansible_devices | dict2items
                    if d.value.removable == '0' and 'USB' not in d.value.host -%}
          {%- set _ = ns.devs.append({'name': d.key,
                'bytes': (d.value.sectors | int) * (d.value.sectorsize | int)}) -%}
          {%- endfor -%}
          {{ ns.devs }}
    - name: Fail when no target disk found
      ansible.builtin.assert:
        that: device is defined
        fail_msg: no non-removable disk found
    - name: Set partition suffix
      tags:
        - disk
      ansible.builtin.set_fact:
        part_suffix: "{{ 'p' if device is match('.*[0-9]$') else '' }}"
    - name: Show target disk
      ansible.builtin.debug:
        msg: "installing to {{ device }}"
    - name: Read device information
      become: true
      tags:
        - disk
      community.general.parted:
        device: "{{ device }}"
        unit: MiB
      register: disk_info
    - name: Remove all partitions from disk
      become: true
      tags:
        - disk
      community.general.parted:
        device: "{{ device }}"
        number: "{{ item.num }}"
        state: absent
      loop: "{{ disk_info.partitions | default([]) }}"
    - name: Add partitions
      become: true
      tags:
        - disk
      block:
        - name: ESP partition
          community.general.parted:
            device: "{{ device }}"
            number: 1
            fs_type: fat32
            label: gpt
            name: esp
            part_start: 2MiB
            part_end: "{{ 2 + 512 }}MiB"
            state: present
        - name: Root partition
          community.general.parted:
            device: "{{ device }}"
            number: 2
            fs_type: btrfs
            label: gpt
            name: root
            part_start: "{{ 2 + 512 }}MiB"
            part_end: "100%"
            state: present
    - name: Format file systems
      become: true
      tags:
        - disk
      block:
        - name: Format esp
          community.general.filesystem:
            dev: "{{ device }}{{ part_suffix }}1"
            fstype: vfat
        - name: Format root
          community.general.filesystem:
            dev: "{{ device }}{{ part_suffix }}2"
            fstype: btrfs
            force: true
    - name: Create btrfs subvolumes
      become: true
      tags:
        - disk
      block:
        - name: Mount toplevel subvolume
          ansible.posix.mount:
            src: "{{ device }}{{ part_suffix }}2"
            path: /btrfs-work
            opts: rw,noatime,compress=zstd:3
            fstype: btrfs
            state: ephemeral
        - name: Create @ and @home
          ansible.builtin.command:
            cmd: btrfs subvolume create /btrfs-work/{{ item }}
            creates: /btrfs-work/{{ item }}
          loop:
            - "@"
            - "@home"
        - name: Unmount toplevel subvolume
          ansible.posix.mount:
            path: /btrfs-work
            state: unmounted
    - name: Mount target tree
      become: true
      tags:
        - disk
      block:
        - name: Mount root
          ansible.posix.mount:
            src: "{{ device }}{{ part_suffix }}2"
            path: "{{ target }}"
            opts: "{{ btrfs_opts }},subvol=/@"
            fstype: btrfs
            state: ephemeral
        - name: Mount home
          ansible.posix.mount:
            src: "{{ device }}{{ part_suffix }}2"
            path: "{{ target }}/home"
            opts: "{{ btrfs_opts }},subvol=/@home"
            fstype: btrfs
            state: ephemeral
        - name: Mount esp
          ansible.posix.mount:
            src: "{{ device }}{{ part_suffix }}1"
            path: "{{ target }}/boot/efi"
            opts: rw,fmask=0077,dmask=0077,codepage=437,iocharset=ascii,shortname=mixed,utf8,errors=remount-ro
            fstype: vfat
            state: ephemeral
    - name: Read partition UUIDs
      become: true
      tags:
        - install
      ansible.builtin.command:
        cmd: blkid -s UUID -o value {{ device }}{{ part_suffix }}{{ item }}
      register: uuids
      changed_when: false
      loop:
        - 1
        - 2
    - name: Debootstrap minimal system
      become: true
      tags:
        - install
      ansible.builtin.command:
        cmd: >-
          debootstrap {{ suite }} {{ target }} {{ mirror }}
        creates: "{{ target }}/etc/debian_version"
    - name: Write apt sources
      become: true
      tags:
        - install
        - apt
      ansible.builtin.copy:
        dest: "{{ target }}/etc/apt/sources.list"
        mode: "0644"
        content: |
          deb {{ mirror }} {{ suite }} main contrib non-free non-free-firmware
          deb {{ mirror }} {{ suite }}-updates main contrib non-free non-free-firmware
          deb {{ mirror }} {{ suite }}-backports main contrib non-free non-free-firmware
    - name: Write fstab
      become: true
      tags:
        - install
      ansible.builtin.copy:
        dest: "{{ target }}/etc/fstab"
        mode: "0644"
        content: |
          UUID={{ uuids.results[1].stdout }} / btrfs {{ btrfs_opts }},subvol=/@ 0 0
          UUID={{ uuids.results[1].stdout }} /home btrfs {{ btrfs_opts }},subvol=/@home 0 0
          UUID={{ uuids.results[0].stdout }} /boot/efi vfat umask=0077 0 2
          tmpfs /tmp tmpfs defaults,nosuid,nodev 0 0
    - name: Write hostname
      become: true
      tags:
        - config
      ansible.builtin.copy:
        dest: "{{ target }}/etc/hostname"
        mode: "0644"
        content: "{{ hostname }}\n"
    - name: Write hosts
      become: true
      tags:
        - config
      ansible.builtin.copy:
        dest: "{{ target }}/etc/hosts"
        mode: "0644"
        content: |
          127.0.0.1 localhost
          127.0.1.1 {{ hostname }}
          ::1 localhost ip6-localhost ip6-loopback
    - name: Copy resolv.conf
      become: true
      tags:
        - config
      ansible.builtin.copy:
        src: /etc/resolv.conf
        dest: "{{ target }}/etc/resolv.conf"
        remote_src: true
        mode: "0644"
    - name: Set root ssh authorized keys
      become: true
      tags:
        - ssh
      block:
        - name: Create ssh authorized keys folder
          ansible.builtin.file:
            path: "{{ target }}/root/.ssh"
            state: directory
            mode: "0700"
            owner: root
            group: root
        - name: Copy ssh root authorized keys
          ansible.builtin.get_url:
            url: https://github.com/ourgal.keys
            dest: "{{ target }}/root/.ssh/authorized_keys"
            mode: "0600"
    - name: Set user ssh authorized keys
      become: true
      tags:
        - ssh
      block:
        - name: Create ssh authorized keys folder
          ansible.builtin.file:
            path: "{{ target }}/home/{{ user }}/.ssh"
            state: directory
            mode: "0700"
        - name: Copy ssh authorized keys
          ansible.builtin.get_url:
            url: https://github.com/ourgal.keys
            dest: "{{ target }}/home/{{ user }}/.ssh/authorized_keys"
            mode: "0600"
    - name: Chroot
      become: true
      tags:
        - chroot
      block:
        - name: Create chroot script
          ansible.builtin.copy:
            dest: "{{ target }}/script"
            mode: "0644"
            content: |
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              echo "{{ hostname }}" > /etc/hostname
              echo "{{ timezone }}" > /etc/timezone
              ln -sf /usr/share/zoneinfo/{{ timezone }} /etc/localtime
              echo "root:$(printf %s '{{ lookup("gopass", "password/linux/root") | trim }}')" | chpasswd
              useradd -m -G sudo {{ user }}
              echo "{{ user }}:$(printf %s '{{ lookup("gopass", "password/linux/user") | trim }}')" | chpasswd
              chown -R {{ user }}:{{ user }} /home/{{ user }}
              apt update
              apt install -y --no-install-recommends locales {{ (base_packages + extra_packages) | join(' ') }}
              sed -i 's/^# *en_US.UTF-8/en_US.UTF-8/; s/^# *zh_CN.UTF-8/zh_CN.UTF-8/' /etc/locale.gen
              locale-gen
              update-locale LANG=en_US.UTF-8
              systemctl enable NetworkManager ssh chrony
              update-initramfs -u
              grub-install --target=x86_64-efi --efi-directory=/boot/efi --bootloader-id=Debian
              update-grub
              apt clean
        - name: Run chroot script
          environment:
            LANG: C.UTF-8
          ansible.builtin.shell:
            executable: /bin/bash
            cmd: |
              set -euo pipefail
              CHROOT={{ target }}
              for _fs in dev proc sys; do
                      mount --rbind "/$_fs" "$CHROOT/$_fs"
                      mount --make-rslave "$CHROOT/$_fs"
              done
              cleanup() {
                      umount -R "$CHROOT/dev" "$CHROOT/proc" "$CHROOT/sys"
              }
              trap cleanup EXIT INT
              chroot "$CHROOT" /bin/bash /script
          changed_when: true
        - name: Remove script
          ansible.builtin.file:
            path: "{{ target }}/script"
            state: absent
    - name: Remove chroot resolv.conf
      become: true
      tags:
        - config
      ansible.builtin.file:
        path: "{{ target }}/etc/resolv.conf"
        state: absent
    - name: Reboot
      become: true
      tags:
        - reboot
      ansible.builtin.command: reboot
      changed_when: true
