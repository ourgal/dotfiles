---
# Port of ~/Documents/scripts/uos/02_setup-miniforge-packages.sh
miniforge_packages_enabled: true
miniforge_packages_dir: "{{ ansible_facts.user_dir }}/miniforge3"
miniforge_packages_channel: conda-forge

# The distro copies are removed first so only the conda-forge toolchain remains.
miniforge_packages_distro_remove: [git, nodejs, npm]
miniforge_packages_list:
  - git
  - lazygit
  - chezmoi
  - nodejs
  - python
  - ansible-core
  - ansible
  - fish
  - zsh
  - tmux
  - zoxide
  - fzf
  - zellij
  - lf
  - ranger-fm
  - nnn
  - uv
  - herdr
  - prettier
  - ripgrep
  - bat
  - eza
  - fd
  - starship
  - delta
  - tig
  - jq
  - shellcheck
  - sd
  - bottom
  - duf
miniforge_packages_verify_bins:
  - git
  - lazygit
  - chezmoi
  - node
  - npm
  - python
  - ansible
  - ansible-playbook
  - fish
  - zsh
  - tmux
  - zoxide
