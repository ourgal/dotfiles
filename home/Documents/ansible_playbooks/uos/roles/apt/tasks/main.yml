---
# Installs workstation apt packages on UOS. The apt/package_facts Ansible modules
# cannot run here: UOS's system Python is 3.7 (too old for Ansible), and the
# Miniforge Python Ansible uses has no python-apt bindings. Drive the CLIs.
- name: Refresh the apt cache  # noqa: command-instead-of-module
  become: true
  ansible.builtin.command:
    cmd: apt-get update
  changed_when: false
  tags: [apt, pkg]

# Probe first so a package missing from the repos does not abort the whole run.
- name: Probe which packages the repos provide
  ansible.builtin.command:
    cmd: "apt-cache show {{ item }}"
  loop: "{{ apt_packages }}"
  loop_control:
    label: "{{ item }}"
  register: apt_probe
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [apt, pkg]

- name: Install the available packages  # noqa: command-instead-of-module
  become: true
  ansible.builtin.command:
    cmd: "apt-get install -y --no-install-recommends {{ apt_probe.results | selectattr('rc', 'equalto', 0) | map(attribute='item') | join(' ') }}"
  environment:
    DEBIAN_FRONTEND: noninteractive
  register: apt_install
  changed_when: "'0 upgraded, 0 newly installed, 0 to remove' not in apt_install.stdout"
  when: apt_probe.results | selectattr('rc', 'equalto', 0) | list | length > 0
  tags: [apt, pkg]
