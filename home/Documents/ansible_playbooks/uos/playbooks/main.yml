---
# One role per script in ~/Documents/scripts/uos/. Each role ports that script to
# idempotent Ansible tasks; the roles run in the same order as the numbered scripts.
#
# The default is the full workstation chain. setup-miniforge-python.sh is an
# alternative minimal bootstrap (Miniforge + Python only), so its role is off by
# default; enable it and switch the chain off with -e, e.g.:
#   ansible-playbook ... -e miniforge_packages_enabled=false \
#     -e npm_packages_enabled=false -e fcitx5_enabled=false \
#     -e miniforge_python_enabled=true
#
# Every role is also tagged, so `make miniforge` / `make fcitx5` run just that one.
- name: Configure uos
  hosts: all
  ignore_unreachable: true
  roles:
    - role: apt
      tags: [apt]
      when: apt_enabled | default(true) | bool
    - role: miniforge
      tags: [miniforge]
      when: miniforge_enabled | default(true) | bool
    - role: miniforge_packages
      tags: [miniforge_packages]
      when: miniforge_packages_enabled | default(true) | bool
    - role: npm_packages
      tags: [npm_packages]
      when: npm_packages_enabled | default(true) | bool
    - role: fcitx5
      tags: [fcitx5]
      when: fcitx5_enabled | default(true) | bool
    - role: miniforge_python
      tags: [miniforge_python]
      when: miniforge_python_enabled | default(false) | bool
