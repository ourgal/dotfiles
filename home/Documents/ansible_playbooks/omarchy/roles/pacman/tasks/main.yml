---
- name: Update system through omarchy
  # pacman -Syu is blocked by the omarchy guard hook; -y because ansible has no TTY
  become: true
  tags:
    - pkg
    - pacman
  ansible.builtin.command: omarchy update -y
  changed_when: false
- name: Install pacman packages
  become: true
  tags:
    - pkg
    - pacman
  community.general.pacman:
    name:
      # du
      - duf
      # dotfiles
      - chezmoi
      # editor
      - helix
      - emacs
      - gvim
      # shell
      - fish
      # password
      - gopass
      # git
      - git-crypt
      # ansible
      - ansible
      - ansible-core
