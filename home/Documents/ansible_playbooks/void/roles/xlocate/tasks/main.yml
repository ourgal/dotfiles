# chezmoi:template:left-delimiter=[[ right-delimiter=]]
---
- name: Download xlocate data
  block:
    - name: Check xlocate folder
      ansible.builtin.stat:
        path: "{{ [ansible_facts.user_dir, '.cache', 'xlocate.git'] | path_join }}"
      register: xlocate_git_stat
    - name: Download xlocate data
      ansible.builtin.command:
        cmd: xlocate -S
      when: xlocate_git_stat.stat.exists is false
      changed_when: true
