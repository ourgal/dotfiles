# chezmoi:template:left-delimiter=[[ right-delimiter=]]
---
- name: Services
  become: true
  block:
    - name: Create per user service folder
      ansible.builtin.file:
        dest: "/etc/sv/runsvdir-{{ ansible_facts.user_id }}"
        state: directory
        mode: "0755"
    - name: Create run script
      ansible.builtin.copy:
        dest: "/etc/sv/runsvdir-{{ ansible_facts.user_id }}/run"
        mode: "0755"
        content: |
          #!/bin/sh

          export USER="{{ ansible_facts.user_id }}"
          export HOME="/home/{{ ansible_facts.user_id }}"

          groups="$(id -Gn "$USER" | tr ' ' ':')"
          svdir="$HOME/service"

          exec chpst -u "$USER:$groups" runsvdir "$svdir"

- name: Enable services
  tags: runit
  become: true
  ansible.builtin.file:
    src: "/etc/sv/{{ item }}"
    dest: "/var/service/{{ item }}"
    state: link
  loop: "{{ runit_enabled_services }}"

- name: Disable services
  tags: runit
  become: true
  ansible.builtin.file:
    path: "/var/service/{{ item }}"
    state: absent
  loop: "{{ runit_disabled_services }}"
