[my.themes.rose-pine]
wm = "glazewm"
startup = ["glazewm", "whkd", "yasb", "tacky_borders"]
background = "#191724"
surface = "#1f1d2e"
overlay = "#26233a"
muted = "#6e6a86"
subtle = "#908caa"
text = "#e0def4"
love = "#eb6f92"
gold = "#f6c177"
rose = "#ebbcba"
pine = "#31748f"
foam = "#9ccfd8"
iris = "#c4a7e7"

[my.themes.rose-pine.tacky]
border_width = 3
border_radius = "Round"

[my.themes.rose-pine.tacky.active]
colors = ["#6274e7", "#8752a3"]
direction = "45deg"

[my.themes.rose-pine.tacky.inactive]
colors = ["#30304f", "#363c69"]
start = [0.0, 1.0]
end = [1.0, 0.0]

